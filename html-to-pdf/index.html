    <script>
        // 页面尺寸（毫米）
        const PAGE_SIZES = {
            a4:    [210, 297],
            a3:    [297, 420],
            a5:    [148, 210],
            letter:[215.9, 279.4],
            legal: [215.9, 355.6]
        };

        const MM_TO_PX = 96 / 25.4; // 1mm ≈ 3.7795px @96dpi
        const DEFAULT_SAMPLE = `<div style="font-family: -apple-system, 'Segoe UI', sans-serif; color:#1a1a2e;">
  <h1 style="color:#0070f3; border-bottom:3px solid #0070f3; padding-bottom:8px;">季度汇报</h1>
  <p>本工具可将任意 <strong>HTML</strong> 片段一键导出为 PDF，支持自定义页面与边距。</p>
  <h2>关键指标</h2>
  <table style="border-collapse:collapse; width:100%;">
    <thead>
      <tr style="background:#0070f3; color:#fff;">
        <th style="border:1px solid #ccc; padding:8px;">指标</th>
        <th style="border:1px solid #ccc; padding:8px;">数值</th>
      </tr>
    </thead>
    <tbody>
      <tr><td style="border:1px solid #ccc; padding:8px;">访问量</td><td style="border:1px solid #ccc; padding:8px;">12,480</td></tr>
      <tr><td style="border:1px solid #ccc; padding:8px;">转化率</td><td style="border:1px solid #ccc; padding:8px;">3.7%</td></tr>
    </tbody>
  </table>
  <h2>要点</h2>
  <ul>
    <li>支持内联样式与 &lt;style&gt; 标签</li>
    <li>支持表格、图片、列表等常见元素</li>
    <li>自动按内容高度分页</li>
  </ul>
</div>`;

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            setTimeout(() => { toast.className = 'toast'; }, 3200);
        }

        // 去除 <script> 标签（不影响版式，仅防止脚本执行）
        function sanitize(html) {
            return html.replace(/<script[\s\S]*?<\/script>/gi, '');
        }

        // 根据页面尺寸 + 方向计算预览容器宽度（像素），使预览与输出一致
        function updatePageWidth() {
            const [w, h] = PAGE_SIZES[document.getElementById('pageSize').value] || PAGE_SIZES.a4;
            const landscape = document.getElementById('orientation').value === 'landscape';
            const pageWmm = landscape ? Math.max(w, h) : Math.min(w, h);
            const px = Math.round(pageWmm * MM_TO_PX);
            document.getElementById('previewPage').style.width = px + 'px';
        }

        function renderPreview() {
            const raw = document.getElementById('htmlInput').value;
            const content = document.getElementById('pdfContent');
            if (!raw.trim()) {
                content.innerHTML = '<div class="empty-hint">在左侧输入 HTML 后点击「预览」</div>';
                return;
            }
            content.innerHTML = sanitize(raw);
            showToast('预览已更新', 'success');
        }

        function loadSample() {
            document.getElementById('htmlInput').value = DEFAULT_SAMPLE;
            renderPreview();
        }

        function clearAll() {
            document.getElementById('htmlInput').value = '';
            document.getElementById('filename').value = 'document';
            renderPreview();
            showToast('已清空');
        }

        // 文件载入
        document.getElementById('fileInput').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById('htmlInput').value = ev.target.result;
                renderPreview();
                showToast('已载入：' + file.name, 'success');
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        // 选项变化时同步预览宽度
        ['pageSize', 'orientation'].forEach(id => {
            document.getElementById(id).addEventListener('change', updatePageWidth);
        });

        // 自动预览（防抖）
        let previewTimer = null;
        document.getElementById('htmlInput').addEventListener('input', function () {
            if (!document.getElementById('autoPreview').checked) return;
            clearTimeout(previewTimer);
            previewTimer = setTimeout(renderPreview, 600);
        });

        async function convertToPDF() {
            const content = document.getElementById('pdfContent');
            const source = document.getElementById('htmlInput').value.trim();
            if (!source) {
                showToast('请先输入 HTML 内容', 'error');
                return;
            }
            // 确保预览是最新内容
            if (content.querySelector('.empty-hint')) renderPreview();

            const btn = document.getElementById('convertBtn');
            const overlay = document.getElementById('loadingOverlay');
            btn.disabled = true;
            overlay.classList.add('show');

            try {
                const [w, h] = PAGE_SIZES[document.getElementById('pageSize').value] || PAGE_SIZES.a4;
                const landscape = document.getElementById('orientation').value === 'landscape';
                const margin = parseFloat(document.getElementById('margin').value) || 0;
                const scale = parseFloat(document.getElementById('scale').value) || 2;
                const rawName = (document.getElementById('filename').value.trim() || 'document');
                const filename = rawName.replace(/[\\/:*?"<>|]/g, '_') + '.pdf';

                const opt = {
                    margin: [margin, margin, margin, margin],
                    filename: filename,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: {
                        scale: scale,
                        useCORS: true,
                        backgroundColor: '#ffffff',
                        logging: false
                    },
                    jsPDF: {
                        unit: 'mm',
                        format: [w, h],
                        orientation: landscape ? 'landscape' : 'portrait'
                    },
                    pagebreak: { mode: ['css', 'legacy'] }
                };

                await html2pdf().set(opt).from(content).save();
                showToast('PDF 已生成：' + filename, 'success');
            } catch (err) {
                console.error(err);
                showToast('生成失败：' + (err.message || err), 'error');
            } finally {
                btn.disabled = false;
                overlay.classList.remove('show');
            }
        }

        // 初始化
        updatePageWidth();
        loadSample();
    </script>

    <script>
      (function () {
        var btn = document.getElementById('themeToggle');
        if (!btn) return;
        function syncIcon() {
          var isDark = document.documentElement.classList.contains('dark');
          btn.querySelector('.theme-toggle-icon').textContent = isDark ? '☀️' : '🌙';
          btn.title = isDark ? '切换到浅色' : '切换到深色';
        }
        function applyTheme(t) {
          if (t === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
          try { localStorage.setItem('theme', t); } catch (e) {}
          syncIcon();
          if (typeof window.__onThemeChange === 'function') window.__onThemeChange(t);
        }
        btn.addEventListener('click', function () {
          applyTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
        });
      syncIcon();
    })();
  </script>

  <script>
    /* ========== 中英切换 ==========
       机制：页面里保留中文原文，MAP 是「中文 → 英文」的对照表。
       切换时遍历文本节点与 placeholder / title / aria-label 做替换，
       首次替换前把原文存到节点上，切回中文时还原（不会翻译两次）。
       JS 动态插入的提示、选项、Toast 由 MutationObserver 补翻。
    */
    (function () {
      var KEY = 'lang';
      var REPO = 'https://github.com/isnotry/MiniTools';
      var MAP = {
        "面包屑导航": "Breadcrumb",
        "HTML 转 PDF · 在线导出 A4 / Letter | MiniTools": "HTML to PDF · Export A4 / Letter Online | MiniTools",
        "把 HTML 内容直接导出成 PDF：可选 A4 / Letter 纸张、纵向或横向、自定义页边距与缩放比例，浏览器本地渲染，不上传服务器，适合报告、合同与网页归档。": "Turn HTML into PDF right in the browser: choose A4 or Letter, portrait or landscape, custom margins and scale. Rendering happens locally — nothing is uploaded. Great for reports, contracts and archiving pages.",
        "在 GitHub 上给项目加星": "Star this project on GitHub",
        "HTML 转 PDF": "HTML to PDF",
        "粘贴 HTML 代码，实时预览，一键导出 PDF": "Paste HTML, preview it live, then export to PDF in one click",
        "① 输入 HTML": "① HTML Input",
        "HTML 源码（支持内联或 <style> 样式）": "HTML source (inline styles or a <style> block)",
        "📂 载入 HTML 文件": "📂 Load HTML file",
        "✨ 示例": "✨ Example",
        "🗑️ 清空": "🗑️ Clear",
        "② 页面设置": "② Page Setup",
        "页面尺寸": "Page size",
        "方向": "Orientation",
        "纵向": "Portrait",
        "横向": "Landscape",
        "边距 (mm)": "Margin (mm)",
        "清晰度 (scale 1-4)": "Scale (1-4)",
        "文件名": "File name",
        "导出的 PDF 文件名（不含扩展名）": "Exported PDF file name (no extension)",
        "编辑时自动预览（输入停止 0.6s 后）": "Auto-preview while typing (0.6s after you stop)",
        "👁️ 预览": "👁️ Preview",
        "📥 转换为 PDF": "📥 Export PDF",
        "提示：导出基于 html2canvas 渲染，PDF 中的文字为图像（不可选中 / 搜索），适合版式截图式导出。如需可选中文字的矢量 PDF，可改用浏览器「打印 → 另存为 PDF」。": "Tip: export is rendered by html2canvas, so text in the PDF is an image (not selectable or searchable) — good for layout snapshots. For selectable vector text, use Print → Save as PDF instead.",
        "③ 预览": "③ Preview",
        "在左侧输入 HTML 后点击「预览」": "Enter HTML on the left, then click Preview",
        "正在生成 PDF，请稍候…": "Generating PDF, please wait…",
        "预览已更新": "Preview updated",
        "已清空": "Cleared",
        "请先输入 HTML 内容": "Please enter HTML content first",
        "切换深色 / 浅色模式": "Toggle dark / light mode",
        "切换主题": "Switch theme",
        "切换到浅色": "Switch to light",
        "切换到深色": "Switch to dark"
      };
      var PAIRS = [
        ["已载入：", "Loaded: "],
        ["PDF 已生成：", "PDF created: "],
        ["生成失败：", "Export failed: "],
        ["在此粘贴 HTML 代码，例如：", "Paste your HTML here, for example:"],
        ["在左侧输入 HTML 后点击「预览」", "Enter HTML on the left, then click Preview"],
        ["<h1>标题</h1>", "<h1>Heading</h1>"],
        ["<p>这是一段正文。</p>", "<p>This is a paragraph.</p>"]
      ];

      var CJK = /[\u4e00-\u9fff\uff00-\uffef]/;
      var busy = false;
      var mo = null;
      var MO_OPT = { childList: true, subtree: true, characterData: true };
      function pause(fn) {
        if (busy) return;
        busy = true;
        try {
          if (mo) mo.disconnect();
          fn();
        } finally {
          if (mo) { try { mo.observe(document.body, MO_OPT); } catch (e) {} }
          busy = false;
        }
      }

      function detect() {
        try {
          var v = localStorage.getItem(KEY);
          if (v === 'zh' || v === 'en') return v;
        } catch (e) {}
        return (navigator.language || '').toLowerCase().indexOf('en') === 0 ? 'en' : 'zh';
      }
      var lang = detect();

      function tr(s) {
        s = String(s);
        var t = s.trim();
        if (MAP[t] != null) return s.replace(t, MAP[t]);
        var out = s;
        for (var i = 0; i < PAIRS.length; i++) {
          if (out.indexOf(PAIRS[i][0]) >= 0) out = out.split(PAIRS[i][0]).join(PAIRS[i][1]);
        }
        return out;
      }

      function applyText(node) {
        if (!node || node.nodeType !== 3) return;
        var v = node.nodeValue;
        if (!v) return;
        if (node.__mt_orig == null) {
          if (!CJK.test(v)) return;
          node.__mt_orig = v;
        }
        var nv = lang === 'en' ? tr(node.__mt_orig) : node.__mt_orig;
        if (nv !== v) node.nodeValue = nv;
      }

      function applyAttrs(el) {
        if (!el || el.nodeType !== 1) return;
        ['placeholder', 'title', 'aria-label'].forEach(function (a) {
          if (!el.hasAttribute(a)) return;
          var v = el.getAttribute(a);
          if (!v) return;
          var k = '__mt_' + a;
          if (el[k] == null) {
            if (!CJK.test(v)) return;
            el[k] = v;
          }
          var nv = lang === 'en' ? tr(el[k]) : el[k];
          if (nv !== v) el.setAttribute(a, nv);
        });
      }

      function walk(root) {
        var tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
        var list = [], n;
        while ((n = tw.nextNode())) list.push(n);
        list.forEach(applyText);
        var els = [];
        if (root.nodeType === 1) {
          els.push(root);
          els = els.concat(Array.prototype.slice.call(root.querySelectorAll('*')));
        }
        els.forEach(applyAttrs);
      }

      function refresh() {
        pause(function () { walk(document.body); });
      }

      window.mtT = function (s) { return lang === 'en' ? tr(s) : s; };

      if (window.MutationObserver) {
        mo = new MutationObserver(function (muts) {
          pause(function () {
            muts.forEach(function (m) {
              if (m.type === 'childList') {
                for (var i = 0; i < m.addedNodes.length; i++) {
                  var a = m.addedNodes[i];
                  if (a.nodeType === 3) applyText(a);
                  else if (a.nodeType === 1) walk(a);
                }
              } else if (m.type === 'characterData') applyText(m.target);
            });
          });
        });
        mo.observe(document.body, MO_OPT);
      }

      function mountStyle() {
        if (document.getElementById('mt-lang-style')) return;
        var st = document.createElement('style');
        st.id = 'mt-lang-style';
st.textContent =
          '.mt-actions{position:fixed;top:16px;right:max(var(--space-4, 16px), calc((100% - var(--mt-shell, 1400px)) / 2 + var(--space-4, 16px)));z-index:1100;display:flex;align-items:center;gap:8px;}' +
          '.mt-actions.inline{position:static;margin-left:auto;}' +
          '.mt-actions>.theme-toggle{position:static;top:auto;right:auto;left:auto;bottom:auto;margin:0;flex:none;}' +
          '.mt-star{height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--gray-200,#eaeaea);background:var(--background,#fff);color:var(--foreground,#171717);font-family:inherit;text-decoration:none;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .2s,border-color .2s,transform .2s;}' +
          '.mt-star:hover{border-color:var(--gray-300,#d4d4d4);transform:scale(1.05);color:var(--foreground,#171717);}' +
          '.mt-star svg{width:15px;height:15px;fill:currentColor;display:block;}' +
          '.mt-lang{height:40px;min-width:46px;padding:0 12px;border-radius:999px;border:1px solid var(--gray-200,#eaeaea);background:var(--background,#fff);color:var(--foreground,#171717);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,transform .2s;}' +
          '.mt-lang:hover{border-color:var(--gray-300,#d4d4d4);transform:scale(1.05);}' +
          '.mt-actions.inline .mt-star,.mt-actions.inline .mt-lang{height:36px;}' +
          '@media (max-width: 640px){.mt-star span{display:none;}.mt-star{padding:0 10px;}}' +
          '@media (hover: none){.mt-star:hover,.mt-lang:hover{transform:none;}}';
                document.head.appendChild(st);
      }

      function syncDoc() {
        document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
        var b = document.getElementById('langToggle');
        if (b) {
          b.textContent = lang === 'en' ? '中' : 'EN';
          var t = lang === 'en' ? 'Switch to Chinese' : 'Switch to English';
          b.setAttribute('title', t);
          b.setAttribute('aria-label', t);
        }
        if (document.__mt_title == null) document.__mt_title = document.title;
        document.title = lang === 'en' ? tr(document.__mt_title) : document.__mt_title;
        var md = document.querySelector('meta[name="description"]');
        if (md) {
          if (md.__mt_orig == null) md.__mt_orig = md.getAttribute('content');
          md.setAttribute('content', lang === 'en' ? tr(md.__mt_orig) : md.__mt_orig);
        }
      }

      function mount() {
        mountStyle();
        var tt = document.getElementById('themeToggle');
        if (!tt || document.getElementById('langToggle')) return;
        var inline = window.getComputedStyle(tt).position !== 'fixed';
        var box = document.createElement('div');
        box.className = 'mt-actions' + (inline ? ' inline' : '');
        tt.parentNode.insertBefore(box, tt);
        box.appendChild(tt);

        var star = document.createElement('a');
        star.className = 'mt-star';
        star.id = 'starLink';
        star.href = REPO;
        star.target = '_blank';
        star.rel = 'noopener noreferrer';
        star.setAttribute('title', '在 GitHub 上给项目加星');
        star.setAttribute('aria-label', '在 GitHub 上给项目加星');
        star.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg><span>Star</span>';
        box.insertBefore(star, tt);

        var btn = document.createElement('button');
        btn.className = 'mt-lang';
        btn.id = 'langToggle';
        btn.type = 'button';
        btn.addEventListener('click', function () {
          lang = lang === 'en' ? 'zh' : 'en';
          try { localStorage.setItem(KEY, lang); } catch (e) {}
          refresh();
          syncDoc();
        });
        box.insertBefore(btn, tt);
      }

      mount();
      refresh();
      syncDoc();
      window.addEventListener('load', function () { refresh(); syncDoc(); });
    })();
  </script>
