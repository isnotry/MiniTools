<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片批处理</title>
    <script src="vendor/jszip.min.js"></script>
    <script src="vendor/heic2any.min.js"></script>
    <style>
        :root {
            --background: #ffffff;
            --background-subtle: #fafafa;
            --background-muted: #f5f5f5;
            --foreground: #171717;
            --foreground-secondary: #666666;
            --foreground-tertiary: #999999;
            --gray-200: #eaeaea;
            --gray-300: #d4d4d4;
            --gray-700: #333333;
            --accent: #0070f3;
            --accent-hover: #0061d5;
            --accent-subtle: #f0f7ff;
            --danger: #d00;
            --danger-subtle: #ffe0e0;
            --success: #0070f3;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            --font-mono: "SF Mono", "Monaco", "Menlo", "Ubuntu Mono", "Consolas", monospace;
            --text-xs: 12px; --text-sm: 13px; --text-base: 14px;
            --text-md: 16px; --text-lg: 20px; --text-xl: 28px;
            --radius: 8px; --radius-sm: 6px;
            --radius-pill: 128px; --radius-full: 9999px;
            --button-primary-hover: #383838;
            --button-secondary-hover: #f2f2f2;
            --space-1: 4px; --space-2: 8px; --space-3: 16px;
            --space-4: 24px; --space-5: 32px;
        
    --mt-shell: 1400px;
  }
        :root.dark {
            --background: #0a0a0a;
            --background-subtle: #111111;
            --background-muted: #1a1a1a;
            --foreground: #ededed;
            --foreground-secondary: #a0a0a0;
            --foreground-tertiary: #666666;
            --gray-200: #333333;
            --gray-300: #444444;
            --gray-700: #cccccc;
            --accent: #0070f3;
            --accent-hover: #3291ff;
            --accent-subtle: #0a2540;
            --danger: #ff6b6b;
            --danger-subtle: #3a1d1d;
            --button-primary-hover: #ccc;
            --button-secondary-hover: #1a1a1a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            color: var(--foreground);
            background: var(--background-subtle);
            min-height: 100vh;
            padding: var(--space-4);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: var(--space-5); }
        .header h1 { font-size: var(--text-xl); font-weight: 700; letter-spacing: -0.02em; margin-bottom: var(--space-2); }
        .header .subtitle { color: var(--foreground-secondary); font-size: var(--text-base); }

        .layout { display: grid; grid-template-columns: 400px 1fr; gap: var(--space-4); align-items: start; }
        @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

        .card {
            background: var(--background);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            padding: var(--space-4);
        }
        .card h2 { margin-bottom: var(--space-3); font-size: var(--text-md); font-weight: 600; letter-spacing: -0.01em; }

        /* 上传区 */
        .dropzone {
            border: 1px dashed var(--gray-300);
            border-radius: var(--radius);
            padding: var(--space-5) var(--space-4);
            text-align: center;
            cursor: pointer;
            transition: background .2s, border-color .2s;
            color: var(--foreground-secondary);
            display: block;
        }
        .dropzone:hover, .dropzone.dragover { background: var(--background-subtle); border-color: var(--accent); }
        .dropzone .dz-icon { color: var(--foreground-tertiary); margin-bottom: var(--space-2); display: flex; justify-content: center; }
        .dropzone .dz-title { font-weight: 600; color: var(--foreground); font-size: 14px; }
        .dropzone .dz-hint { font-size: var(--text-sm); color: var(--foreground-tertiary); margin-top: 4px; }
        input[type="file"] { display: none; }

        .input-group { margin-bottom: var(--space-3); }
        .input-group label { display: block; color: var(--foreground-secondary); margin-bottom: var(--space-2); font-weight: 500; font-size: 14px; }
        input[type="text"], input[type="number"], select {
            width: 100%; padding: 10px 12px;
            border: 1px solid var(--gray-200); border-radius: var(--radius);
            font-size: 14px; font-family: var(--font-sans);
            color: var(--foreground); background: var(--background);
            transition: border-color .2s, box-shadow .2s;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-subtle); }
        input::placeholder { color: var(--foreground-tertiary); }
        input:disabled { opacity: .45; cursor: not-allowed; }

        .format-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); margin-top: var(--space-3); }

        /* 缩放行 */
        .resize-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: var(--space-2); align-items: end; }
        .lock-btn {
            width: 40px; height: 40px;
            border: 1px solid var(--gray-200); border-radius: var(--radius);
            background: var(--background); color: var(--foreground-secondary);
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            transition: background .2s, border-color .2s, color .2s; margin-bottom: 1px;
        }
        .lock-btn.locked { color: var(--accent); border-color: var(--accent); background: var(--accent-subtle); }
        .help-text { font-size: 13px; color: var(--foreground-tertiary); margin-top: 6px; line-height: 1.5; }

        .btn-group { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-4); }
        .btn {
            display: inline-flex; align-items: center; gap: 7px;
            height: 48px; padding: 0 22px;
            font-size: 16px; font-weight: 500; line-height: 1;
            border-radius: var(--radius-pill);
            border: 1px solid transparent;
            cursor: pointer; font-family: var(--font-sans);
            transition: background .2s, border-color .2s, color .2s;
        }
        .btn-primary { background: var(--foreground); color: var(--background); }
        .btn-primary:hover { background: var(--button-primary-hover); }
        .btn-ghost { background: var(--background); color: var(--foreground-secondary); border-color: var(--gray-200); }
        .btn-ghost:hover { background: var(--button-secondary-hover); }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-sm { height: 36px; padding: 0 14px; font-size: 14px; }

        /* 文件列表 */
        .list-wrap {
            background: var(--background);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            padding: var(--space-4);
        }
        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-3); }
        .list-header h2 { margin: 0; }
        .list-summary { font-size: var(--text-sm); color: var(--foreground-secondary); font-family: var(--font-mono); }
        .list-summary strong { color: var(--foreground); }

        .file-list { max-height: 70vh; overflow-y: auto; display: flex; flex-direction: column; gap: var(--space-2); }
        .file-row {
            display: grid;
            grid-template-columns: 56px 1fr auto;
            gap: var(--space-3);
            align-items: center;
            padding: var(--space-2);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            background: var(--background);
            transition: background .2s;
        }
        .file-row.processing { background: var(--background-subtle); }
        .file-row.done { background: var(--background); }
        .file-thumb {
            width: 56px; height: 56px; border-radius: var(--radius-sm);
            object-fit: cover; border: 1px solid var(--gray-200);
            background: var(--background-muted);
        }
        .file-thumb-placeholder {
            width: 56px; height: 56px; border-radius: var(--radius-sm);
            border: 1px solid var(--gray-200); background: var(--background-muted);
            display: flex; align-items: center; justify-content: center;
            color: var(--foreground-tertiary); font-size: 11px; font-family: var(--font-mono);
        }
        .file-info { min-width: 0; }
        .file-name { font-weight: 600; color: var(--foreground); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-meta { font-size: var(--text-xs); color: var(--foreground-tertiary); font-family: var(--font-mono); margin-top: 2px; }
        .file-meta .arrow { color: var(--foreground-tertiary); margin: 0 6px; }
        .file-meta .new { color: var(--foreground); font-weight: 600; }
        .file-meta .saved { color: var(--accent); font-weight: 600; }
        .file-meta .bigger { color: var(--danger); font-weight: 600; }
        .file-status {
            font-size: var(--text-xs); color: var(--foreground-tertiary);
            display: flex; align-items: center; gap: var(--space-2);
        }
        .mini-spinner {
            width: 14px; height: 14px;
            border: 2px solid var(--gray-200);
            border-top-color: var(--foreground-secondary);
            border-radius: 50%; animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-hint { color: var(--foreground-tertiary); text-align: center; padding: 60px 20px; font-size: 14px; }
        .empty-hint .eh-icon { opacity: .6; margin-bottom: 12px; display: flex; justify-content: center; }

        /* Toast：前景反色 */
        .toast {
            position: fixed; left: 50%; bottom: 32px; z-index: 1200;
            transform: translateX(-50%) translateY(20px);
            opacity: 0; pointer-events: none;
            padding: 12px 20px; border-radius: var(--radius);
            border: 1px solid var(--gray-200);
            background: var(--foreground); color: var(--background);
            font-size: var(--text-base); font-weight: 500;
            box-shadow: 0 8px 24px rgba(0,0,0,0.10), 0 2px 6px rgba(0,0,0,0.06);
            transition: transform .25s, opacity .25s; max-width: 90%;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
        .toast.success, .toast.info { background: var(--foreground); color: var(--background); }
        .toast.error { background: var(--danger); color: #fff; border-color: var(--danger); }

        .theme-toggle {
            position: fixed; top: 16px; right: max(var(--space-4, 16px), calc((100% - var(--mt-shell)) / 2)); z-index: 1100;
            width: 40px; height: 40px; border-radius: var(--radius-full);
            border: 1px solid var(--gray-200); background: var(--background); color: var(--foreground);
            font-size: 18px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            transition: background .2s, border-color .2s, transform .2s;
        }
        .theme-toggle:hover { border-color: var(--gray-300); transform: scale(1.05); }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <script>
      (function () {
        try {
          var l = localStorage.getItem('lang');
          if (l === 'en') document.documentElement.lang = 'en';
          else if (l === 'zh') document.documentElement.lang = 'zh-CN';
          else if ((navigator.language || '').toLowerCase().indexOf('en') === 0) document.documentElement.lang = 'en';
        } catch (e) {}
      })();
    </script>
</head>
<body>
    <div class="container">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换深色 / 浅色模式" title="切换主题">
            <span class="theme-toggle-icon">🌙</span>
        </button>

        <div class="header">
            <h1>图片批处理</h1>
            <p class="subtitle">批量格式转换 · 缩放 · 压缩，支持 HEIC/HEIF，最多 99 张，本地处理不上传</p>
        </div>

        <div class="layout">
            <!-- 左侧：上传与设置 -->
            <div class="card">
                <h2>① 添加图片</h2>
                <label class="dropzone" id="dropzone" for="fileInput">
                    <div class="dz-icon" aria-hidden="true">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <path d="M21 15l-5-5L5 21"/>
                        </svg>
                    </div>
                    <div class="dz-title">点击选择 或 拖拽图片到此</div>
                    <div class="dz-hint">支持 HEIC / HEIF / JPG / PNG / WebP，最多 99 张</div>
                </label>
                <input type="file" id="fileInput" accept=".heic,.heif,.jpg,.jpeg,.png,.webp,image/*" multiple>

                <h2 style="margin-top:24px;">② 处理设置</h2>

                <div class="format-row">
                    <div class="input-group" style="margin:0;">
                        <label for="fmtSelect">输出格式</label>
                        <select id="fmtSelect">
                            <option value="image/jpeg" selected>JPEG</option>
                            <option value="image/png">PNG（无损）</option>
                            <option value="image/webp">WebP</option>
                        </select>
                    </div>
                    <div class="input-group" style="margin:0;">
                        <label for="qualityInput">质量 (JPEG/WebP)</label>
                        <input type="number" id="qualityInput" value="0.85" min="0.1" max="1" step="0.05">
                    </div>
                </div>
                <div class="help-text">JPEG/WebP 质量越低文件越小，0.8 左右通常是体积与画质的平衡点。</div>

                <div class="input-group" style="margin-top:16px;">
                    <label>缩放尺寸（可选，留空则不缩放）</label>
                    <div class="resize-row">
                        <div><input type="number" id="widthInput" placeholder="宽" min="1" step="1"></div>
                        <button class="lock-btn locked" id="lockBtn" type="button" onclick="toggleLock()" title="锁定宽高比例">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="lockIcon">
                                <rect x="5" y="11" width="14" height="10" rx="2"/>
                                <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                            </svg>
                        </button>
                        <div><input type="number" id="heightInput" placeholder="高" min="1" step="1"></div>
                    </div>
                    <div class="help-text">填入目标宽/高（像素），锁定比例时改一个另一个自动算。留空表示保持原尺寸（仅转换格式/压缩）。</div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" id="processBtn" onclick="processAll()" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 4 21 9 16 9"/></svg>
                        开始处理
                    </button>
                    <button class="btn btn-ghost" onclick="downloadAll()" id="downloadAllBtn" disabled>打包下载 ZIP</button>
                    <button class="btn btn-ghost" onclick="clearAll()">清空</button>
                </div>
            </div>

            <!-- 右侧：文件列表 -->
            <div class="list-wrap">
                <div class="list-header">
                    <h2>③ 文件列表</h2>
                    <div class="list-summary" id="listSummary"></div>
                </div>
                <div class="file-list" id="fileList">
                    <div class="empty-hint" id="emptyHint">
                        <div class="eh-icon" aria-hidden="true">
                            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <path d="M3 12h18M12 3v18"/>
                            </svg>
                        </div>
                        添加图片后，这里会显示文件列表与处理结果
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        var MAX_FILES = 99;
        var items = [];        // { id, file, name, origType, origSize, origW, origH, img, thumbUrl, status, outBlob, outSize, outType, outExt, outW, outH }
        var ratioLocked = true;
        var nextId = 1;

        /* ========== 工具函数 ========== */
        function showToast(msg, type) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show ' + (type || 'info');
            setTimeout(function () { t.className = 'toast'; }, 2800);
        }
        function formatSize(b) {
            if (b < 1024) return b + ' B';
            if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
            return (b / 1024 / 1024).toFixed(2) + ' MB';
        }
        function extForType(type) {
            if (type === 'image/jpeg') return 'jpg';
            if (type === 'image/webp') return 'webp';
            return 'png';
        }
        function isHeic(file) {
            return file.type === 'image/heic' || file.type === 'image/heif' || /\.heic$|\.heif$/i.test(file.name);
        }
        function baseName(name) { return name.replace(/\.[^.]+$/, '') || 'image'; }

        /* ========== 文件加载 ========== */
        var dz = document.getElementById('dropzone');
        document.getElementById('fileInput').addEventListener('change', function (e) {
            if (e.target.files && e.target.files.length) addFiles(e.target.files);
            e.target.value = '';
        });
        ['dragenter', 'dragover'].forEach(function (ev) {
            dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add('dragover'); });
        });
        ['dragleave', 'drop'].forEach(function (ev) {
            dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove('dragover'); });
        });
        dz.addEventListener('drop', function (e) {
            var fs = e.dataTransfer.files;
            if (fs && fs.length) addFiles(fs);
        });

        function addFiles(fileList) {
            var arr = Array.prototype.slice.call(fileList).filter(function (f) {
                return f.type.startsWith('image/') || isHeic(f);
            });
            if (items.length + arr.length > MAX_FILES) {
                showToast('最多 ' + MAX_FILES + ' 张，已添加 ' + items.length + ' 张，本次最多再添加 ' + (MAX_FILES - items.length) + ' 张', 'error');
                arr = arr.slice(0, MAX_FILES - items.length);
            }
            if (!arr.length) return;
            arr.forEach(function (f) {
                var item = { id: nextId++, file: f, name: f.name, origSize: f.size, origType: f.type || (isHeic(f) ? 'image/heic' : ''), status: 'loading' };
                items.push(item);
                loadItem(item);
            });
            renderList();
            showToast('已添加 ' + arr.length + ' 张', 'success');
        }

        // 加载单张：HEIC 走 heic2any，其他直接 Image
        function loadItem(item) {
            var file = item.file;
            if (isHeic(file)) {
                // HEIC → 先转 JPEG blob 以便预览与后续 canvas 处理
                if (typeof heic2any === 'undefined') {
                    item.status = 'error';
                    item.error = 'HEIC 解码库未加载';
                    renderList();
                    return;
                }
                heic2any({ blob: file, toType: 'image/jpeg', quality: 0.92 }).then(function (r) {
                    var blob = Array.isArray(r) ? r[0] : r;
                    var url = URL.createObjectURL(blob);
                    var im = new Image();
                    im.onload = function () {
                        item.img = im;
                        item.thumbUrl = url;
                        item.origW = im.naturalWidth;
                        item.origH = im.naturalHeight;
                        item.status = 'ready';
                        renderList();
                    };
                    im.onerror = function () { item.status = 'error'; item.error = 'HEIC 解码失败'; renderList(); };
                    im.src = url;
                }).catch(function () { item.status = 'error'; item.error = 'HEIC 解码失败'; renderList(); });
            } else {
                var url = URL.createObjectURL(file);
                var im = new Image();
                im.onload = function () {
                    item.img = im;
                    item.thumbUrl = url;
                    item.origW = im.naturalWidth;
                    item.origH = im.naturalHeight;
                    item.status = 'ready';
                    renderList();
                };
                im.onerror = function () { item.status = 'error'; item.error = '图片解码失败'; renderList(); };
                im.src = url;
            }
        }

        /* ========== 缩放锁定 ========== */
        function toggleLock() {
            ratioLocked = !ratioLocked;
            var btn = document.getElementById('lockBtn');
            btn.classList.toggle('locked', ratioLocked);
            btn.title = ratioLocked ? '已锁定宽高比例' : '未锁定（自由缩放）';
            document.getElementById('lockIcon').innerHTML = ratioLocked
                ? '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'
                : '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0"/>';
        }
        document.getElementById('widthInput').addEventListener('input', function () {
            if (ratioLocked) {
                var w = parseInt(this.value, 10);
                // 用第一张就绪图的原始比例作参考（批处理统一比例）
                var ref = items.find(function (it) { return it.img; });
                if (w > 0 && ref) document.getElementById('heightInput').value = Math.round(w * ref.origH / ref.origW);
            }
        });
        document.getElementById('heightInput').addEventListener('input', function () {
            if (ratioLocked) {
                var h = parseInt(this.value, 10);
                var ref = items.find(function (it) { return it.img; });
                if (h > 0 && ref) document.getElementById('widthInput').value = Math.round(h * ref.origW / ref.origH);
            }
        });

        /* ========== 处理引擎 ========== */
        function outType() { return document.getElementById('fmtSelect').value; }
        function outQuality() {
            var q = parseFloat(document.getElementById('qualityInput').value);
            if (isNaN(q) || q <= 0 || q > 1) q = 0.85;
            return q;
        }
        function targetSize(item) {
            var w = parseInt(document.getElementById('widthInput').value, 10);
            var h = parseInt(document.getElementById('heightInput').value, 10);
            if ((!w || w < 1) && (!h || h < 1)) return null; // 不缩放
            var tw = w > 0 ? w : item.origW;
            var th = h > 0 ? h : item.origH;
            return { w: tw, h: th };
        }
        function canvasToBlob(canvas, type, q) {
            return new Promise(function (resolve) {
                canvas.toBlob(function (b) { resolve(b); }, type, q);
            });
        }

        async function processOne(item) {
            if (!item.img) { item.status = 'error'; item.error = '图片未加载'; return; }
            item.status = 'processing';
            renderList();
            try {
                var ts = targetSize(item);
                var tw = ts ? ts.w : item.origW;
                var th = ts ? ts.h : item.origH;
                var cv = document.createElement('canvas');
                cv.width = tw; cv.height = th;
                var ctx = cv.getContext('2d');
                // PNG 输出时保持透明，JPEG/WebP 填白底
                if (outType() !== 'image/png') {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, tw, th);
                }
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(item.img, 0, 0, tw, th);
                var blob = await canvasToBlob(cv, outType(), outQuality());
                item.outBlob = blob;
                item.outSize = blob.size;
                item.outType = outType();
                item.outExt = extForType(outType());
                item.outW = tw;
                item.outH = th;
                item.status = 'done';
            } catch (e) {
                item.status = 'error';
                item.error = (e.message || '处理失败');
            }
            renderList();
        }

        async function processAll() {
            var ready = items.filter(function (it) { return it.status === 'ready' || it.status === 'done' || it.status === 'error'; });
            var todo = items.filter(function (it) { return it.img && it.status !== 'processing'; });
            if (!todo.length) { showToast('没有可处理的图片', 'error'); return; }
            document.getElementById('processBtn').disabled = true;
            for (var i = 0; i < todo.length; i++) {
                await processOne(todo[i]);
            }
            document.getElementById('processBtn').disabled = false;
            var done = items.filter(function (it) { return it.status === 'done'; }).length;
            var failed = items.filter(function (it) { return it.status === 'error'; }).length;
            if (failed) showToast('完成 ' + done + ' 张，失败 ' + failed + ' 张', 'error');
            else showToast('全部处理完成，共 ' + done + ' 张', 'success');
            updateButtons();
        }

        /* ========== 下载 ========== */
        function downloadBlob(blob, filename) {
            var a = document.createElement('a');
            a.download = filename; a.href = URL.createObjectURL(blob); a.click();
            setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
        }
        function downloadOne(item) {
            if (!item.outBlob) return;
            downloadBlob(item.outBlob, baseName(item.name) + '.' + item.outExt);
        }
        async function downloadAll() {
            var done = items.filter(function (it) { return it.outBlob; });
            if (!done.length) { showToast('没有可下载的结果', 'error'); return; }
            if (done.length === 1) { downloadOne(done[0]); return; }
            showToast('正在打包…', 'info');
            var zip = new JSZip();
            var used = {};
            done.forEach(function (it) {
                var fname = baseName(it.name) + '.' + it.outExt;
                if (used[fname]) { used[fname]++; fname = baseName(it.name) + '_' + used[fname] + '.' + it.outExt; }
                else used[fname] = 1;
                zip.file(fname, it.outBlob);
            });
            var blob = await zip.generateAsync({ type: 'blob' });
            downloadBlob(blob, '图片批处理结果_' + new Date().toISOString().slice(0, 10) + '.zip');
            showToast('已打包 ' + done.length + ' 张', 'success');
        }

        /* ========== 列表渲染 ========== */
        function renderList() {
            var list = document.getElementById('fileList');
            var summary = document.getElementById('listSummary');

            // 计算汇总
            var readyCount = items.filter(function (it) { return it.img; }).length;
            var doneCount = items.filter(function (it) { return it.status === 'done'; }).length;
            var origTotal = items.reduce(function (s, it) { return s + (it.origSize || 0); }, 0);
            var outTotal = items.filter(function (it) { return it.outSize; }).reduce(function (s, it) { return s + it.outSize; }, 0);
            if (items.length) {
                var parts = ['共 <strong>' + items.length + '</strong> 张'];
                if (readyCount < items.length) parts.push('已加载 ' + readyCount);
                if (doneCount) parts.push('已处理 ' + doneCount);
                if (outTotal) {
                    parts.push('原始 ' + formatSize(origTotal));
                    parts.push('处理后 ' + formatSize(outTotal));
                    if (origTotal > 0) {
                        var saved = Math.round((1 - outTotal / origTotal) * 100);
                        if (saved > 0) parts.push('节省 <strong>' + saved + '%</strong>');
                        else if (saved < 0) parts.push('增大 <strong>' + (-saved) + '%</strong>');
                    }
                }
                summary.innerHTML = parts.join(' · ');
            } else {
                summary.innerHTML = '';
            }

            // 渲染行
            var html = items.map(function (it) {
                var thumb = it.thumbUrl
                    ? '<img class="file-thumb" src="' + it.thumbUrl + '" alt="">'
                    : '<div class="file-thumb-placeholder">' + (isHeic(it.file) ? 'HEIC' : '...') + '</div>';

                var meta = '';
                if (it.status === 'loading') {
                    meta = '<span class="file-meta">加载中…</span>';
                } else if (it.status === 'error') {
                    meta = '<span class="file-meta" style="color:var(--danger)">' + (it.error || '错误') + '</span>';
                } else if (it.img) {
                    var origInfo = (it.origType === 'image/heic' ? 'HEIC' : extForType(it.origType || 'image/jpeg').toUpperCase()) + ' · ' + formatSize(it.origSize) + ' · ' + it.origW + '×' + it.origH;
                    if (it.status === 'done' && it.outBlob) {
                        var saved = it.origSize > 0 ? Math.round((1 - it.outSize / it.origSize) * 100) : 0;
                        var savedCls = saved >= 0 ? 'saved' : 'bigger';
                        var savedTxt = saved >= 0 ? '节省 ' + saved + '%' : '增大 ' + (-saved) + '%';
                        meta = '<span class="file-meta">' + origInfo +
                            ' <span class="arrow">→</span> <span class="new">' + it.outExt.toUpperCase() + ' · ' + formatSize(it.outSize) + ' · ' + it.outW + '×' + it.outH + '</span>' +
                            ' <span class="' + savedCls + '">' + savedTxt + '</span></span>';
                    } else {
                        meta = '<span class="file-meta">' + origInfo + '</span>';
                    }
                }

                var status = '';
                if (it.status === 'processing') {
                    status = '<span class="file-status"><span class="mini-spinner"></span></span>';
                } else if (it.status === 'done') {
                    status = '<button class="btn btn-ghost btn-sm" onclick="downloadOne(items.find(function(i){return i.id===' + it.id + '}))">下载</button>';
                }

                return '<div class="file-row ' + it.status + '">' + thumb + '<div class="file-info"><div class="file-name">' + it.name + '</div>' + meta + '</div>' + status + '</div>';
            }).join('');
            list.innerHTML = html + (items.length ? '' : '<div class="empty-hint" id="emptyHint"><div class="eh-icon" aria-hidden="true"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M12 3v18"/></svg></div>添加图片后，这里会显示文件列表与处理结果</div>');
            updateButtons();
        }

        function updateButtons() {
            var hasReady = items.some(function (it) { return it.img; });
            document.getElementById('processBtn').disabled = !hasReady;
            var hasDone = items.some(function (it) { return it.outBlob; });
            document.getElementById('downloadAllBtn').disabled = !hasDone;
        }

        function clearAll() {
            items.forEach(function (it) { if (it.thumbUrl && it.thumbUrl.startsWith('blob:')) URL.revokeObjectURL(it.thumbUrl); });
            items = [];
            document.getElementById('widthInput').value = '';
            document.getElementById('heightInput').value = '';
            renderList();
            showToast('已清空');
        }

        // 格式选择联动质量输入
        document.getElementById('fmtSelect').addEventListener('change', function () {
            document.getElementById('qualityInput').disabled = this.value === 'image/png';
        });
    </script>

    <script>
      (function () {
        var btn = document.getElementById('themeToggle');
        if (!btn) return;
        function syncIcon() {
          var isDark = document.documentElement.classList.contains('dark');
          btn.querySelector('.theme-toggle-icon').textContent = isDark ? '☀️' : '🌙';
          btn.title = isDark ? '切换到浅色' : '切换到深色';
        }
        function applyTheme(t) {
          if (t === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
          try { localStorage.setItem('theme', t); } catch (e) {}
          syncIcon();
          if (typeof window.__onThemeChange === 'function') window.__onThemeChange(t);
        }
        btn.addEventListener('click', function () {
          applyTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
        });
        syncIcon();
      })();
    </script>

    <script>
    /* ========== 中英切换 ==========
       机制：页面里保留中文原文，MAP 是「中文 → 英文」的对照表。
       切换时遍历文本节点与 placeholder / title / aria-label 做替换，
       首次替换前把原文存到节点上，切回中文时还原（不会翻译两次）。
       JS 动态插入的提示、选项、Toast 由 MutationObserver 补翻。
    */
    (function () {
      var KEY = 'lang';
      var MAP = {
        "图片批处理": "Image Batch",
        "批量格式转换 · 缩放 · 压缩，支持 HEIC/HEIF，最多 99 张，本地处理不上传": "Batch convert, resize and compress HEIC/HEIF images — up to 99 files, all processed locally.",
        "① 添加图片": "① Add images",
        "点击选择 或 拖拽图片到此": "Click to browse or drop images here",
        "支持 HEIC / HEIF / JPG / PNG / WebP，最多 99 张": "HEIC / HEIF / JPG / PNG / WebP, up to 99 files",
        "② 处理设置": "② Processing settings",
        "输出格式": "Output format",
        "PNG（无损）": "PNG (lossless)",
        "质量 (JPEG/WebP)": "Quality (JPEG/WebP)",
        "JPEG/WebP 质量越低文件越小，0.8 左右通常是体积与画质的平衡点。": "The lower the JPEG/WebP quality, the smaller the file; around 0.8 is usually the sweet spot between size and image quality.",
        "缩放尺寸（可选，留空则不缩放）": "Resize dimensions (optional, leave blank to keep size)",
        "宽": "Width",
        "高": "Height",
        "锁定宽高比例": "Lock aspect ratio",
        "已锁定宽高比例": "Aspect ratio locked",
        "未锁定（自由缩放）": "Unlocked (free resize)",
        "填入目标宽/高（像素），锁定比例时改一个另一个自动算。留空表示保持原尺寸（仅转换格式/压缩）。": "Enter a target width/height in pixels; while the ratio is locked the other side follows. Leave blank to keep the original size (convert or compress only).",
        "开始处理": "Start",
        "打包下载 ZIP": "Download ZIP",
        "清空": "Clear",
        "③ 文件列表": "③ Files",
        "添加图片后，这里会显示文件列表与处理结果": "Files and their results will show up here once you add images.",
        "加载中…": "Loading…",
        "错误": "Error",
        "HEIC 解码库未加载": "HEIC decoder not loaded",
        "HEIC 解码失败": "HEIC decode failed",
        "图片解码失败": "Image decode failed",
        "图片未加载": "Image not loaded",
        "处理失败": "Processing failed",
        "没有可处理的图片": "Nothing to process",
        "没有可下载的结果": "Nothing to download yet",
        "正在打包…": "Zipping…",
        "已清空": "Cleared",
        "切换深色 / 浅色模式": "Toggle dark / light mode",
        "切换主题": "Switch theme",
        "切换到浅色": "Switch to light",
        "切换到深色": "Switch to dark"
      };
      var PAIRS = [
        ["全部处理完成，共", "All done —"],
        ["张，已添加", "files —"],
        ["张，本次最多再添加", "already added, at most"],
        ["张，失败", "done,"],
        ["完成", ""],
        ["已添加", "Added"],
        ["已打包", "Zipped"],
        ["已加载", "Loaded"],
        ["已处理", "Processed"],
        ["最多", "Up to"],
        ["原始", "original"],
        ["处理后", "new"],
        ["节省", "saved"],
        ["增大", "increased"],
        ["共", "Total"],
        ["加载中…", "Loading…"],
        ["下载", "Download"],
        ["添加图片后，这里会显示文件列表与处理结果", "Files and their results will show up here once you add images."],
        ["张", "files"]
      ];

      var CJK = /[\u4e00-\u9fff\uff00-\uffef]/;
      var busy = false;
      var mo = null;
      var MO_OPT = { childList: true, subtree: true, characterData: true };
      function pause(fn) {
        if (busy) return;
        busy = true;
        try {
          if (mo) mo.disconnect();
          fn();
        } finally {
          if (mo) { try { mo.observe(document.body, MO_OPT); } catch (e) {} }
          busy = false;
        }
      }

      function detect() {
        try {
          var v = localStorage.getItem(KEY);
          if (v === 'zh' || v === 'en') return v;
        } catch (e) {}
        return (navigator.language || '').toLowerCase().indexOf('en') === 0 ? 'en' : 'zh';
      }
      var lang = detect();

      function tr(s) {
        s = String(s);
        var t = s.trim();
        if (MAP[t] != null) return s.replace(t, MAP[t]);
        var out = s;
        for (var i = 0; i < PAIRS.length; i++) {
          if (out.indexOf(PAIRS[i][0]) >= 0) out = out.split(PAIRS[i][0]).join(PAIRS[i][1]);
        }
        return out;
      }

      function applyText(node) {
        if (!node || node.nodeType !== 3) return;
        var v = node.nodeValue;
        if (!v) return;
        if (node.__mt_orig == null) {
          if (!CJK.test(v)) return;
          node.__mt_orig = v;
        }
        var nv = lang === 'en' ? tr(node.__mt_orig) : node.__mt_orig;
        if (nv !== v) node.nodeValue = nv;
      }

      function applyAttrs(el) {
        if (!el || el.nodeType !== 1) return;
        ['placeholder', 'title', 'aria-label'].forEach(function (a) {
          if (!el.hasAttribute(a)) return;
          var v = el.getAttribute(a);
          if (!v) return;
          var k = '__mt_' + a;
          if (el[k] == null) {
            if (!CJK.test(v)) return;
            el[k] = v;
          }
          var nv = lang === 'en' ? tr(el[k]) : el[k];
          if (nv !== v) el.setAttribute(a, nv);
        });
      }

      function walk(root) {
        var tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
        var list = [], n;
        while ((n = tw.nextNode())) list.push(n);
        list.forEach(applyText);
        var els = [];
        if (root.nodeType === 1) {
          els.push(root);
          els = els.concat(Array.prototype.slice.call(root.querySelectorAll('*')));
        }
        els.forEach(applyAttrs);
      }

      function refresh() {
        pause(function () { walk(document.body); });
      }

      window.mtT = function (s) { return lang === 'en' ? tr(s) : s; };

      if (window.MutationObserver) {
        mo = new MutationObserver(function (muts) {
          pause(function () {
            muts.forEach(function (m) {
              if (m.type === 'childList') {
                for (var i = 0; i < m.addedNodes.length; i++) {
                  var a = m.addedNodes[i];
                  if (a.nodeType === 3) applyText(a);
                  else if (a.nodeType === 1) walk(a);
                }
              } else if (m.type === 'characterData') applyText(m.target);
            });
          });
        });
        mo.observe(document.body, MO_OPT);
      }

      function mountStyle() {
        if (document.getElementById('mt-lang-style')) return;
        var st = document.createElement('style');
        st.id = 'mt-lang-style';
        st.textContent =
          '.mt-lang{position:fixed;top:16px;right:calc(max(var(--space-4, 16px), calc((100% - var(--mt-shell)) / 2)) + 48px);z-index:1100;height:40px;min-width:46px;' +
          'padding:0 12px;border-radius:999px;border:1px solid var(--gray-200,#eaeaea);' +
          'background:var(--background,#fff);color:var(--foreground,#171717);font-family:inherit;' +
          'font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;' +
          'justify-content:center;transition:background .2s,border-color .2s,transform .2s;}' +
          '.mt-lang:hover{border-color:var(--gray-300,#d4d4d4);transform:scale(1.05);}' +
          '.mt-lang.inline{position:static;height:36px;margin-left:auto;margin-right:8px;}' +
          '@media (hover: none){.mt-lang:hover{transform:none;}}';
        document.head.appendChild(st);
      }

      function syncDoc() {
        document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
        var b = document.getElementById('langToggle');
        if (b) {
          b.textContent = lang === 'en' ? '中' : 'EN';
          var t = lang === 'en' ? 'Switch to Chinese' : 'Switch to English';
          b.setAttribute('title', t);
          b.setAttribute('aria-label', t);
        }
        if (document.__mt_title == null) document.__mt_title = document.title;
        document.title = lang === 'en' ? tr(document.__mt_title) : document.__mt_title;
      }

      function mount() {
        mountStyle();
        var tt = document.getElementById('themeToggle');
        if (!tt || document.getElementById('langToggle')) return;
        var btn = document.createElement('button');
        var inline = window.getComputedStyle(tt).position !== 'fixed';
        btn.className = 'mt-lang' + (inline ? ' inline' : '');
        btn.id = 'langToggle';
        btn.type = 'button';
        btn.addEventListener('click', function () {
          lang = lang === 'en' ? 'zh' : 'en';
          try { localStorage.setItem(KEY, lang); } catch (e) {}
          refresh();
          syncDoc();
        });
        tt.parentNode.insertBefore(btn, tt);
      }

      mount();
      refresh();
      syncDoc();
      window.addEventListener('load', function () { refresh(); syncDoc(); });
    })();
    </script>
