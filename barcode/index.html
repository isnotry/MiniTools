    <script>
        let generatedBarcodes = [];

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            setTimeout(() => {
                toast.className = 'toast';
            }, 3000);
        }

        function parseInput(text) {
            // 支持多种分隔符: 换行、逗号、分号、空格、制表符
            const items = text.split(/[\n,\s;，；\t]+/).filter(item => item.trim());
            return items.map(item => item.trim()).filter(item => item.length > 0);
        }

        function detectFormat(value) {
            const format = document.getElementById('barcodeFormat').value;
            if (!document.getElementById('autoParse').checked) {
                return format;
            }

            // 自动识别格式
            const cleanValue = value.replace(/[\s-]/g, '');

            // EAN-13: 13位数字，以非0开头，但先用CODE128尝试，如果失败再用EAN13
            if (/^\d{13}$/.test(cleanValue) && cleanValue[0] !== '0') {
                return 'EAN13';
            }
            // UPC-A: 12位数字
            if (/^\d{12}$/.test(cleanValue)) {
                return 'UPC';
            }
            // EAN-8: 8位数字
            if (/^\d{8}$/.test(cleanValue)) {
                return 'EAN8';
            }
            // ITF-14: 14位数字（物流用）
            if (/^\d{14}$/.test(cleanValue)) {
                return 'ITF14';
            }
            // 纯数字但长度超过13位，用CODE128C
            if (/^\d+$/.test(cleanValue) && cleanValue.length > 13) {
                return 'CODE128C';
            }

            // 默认返回选中的格式
            return format;
        }

        function generateBarcodeSVG(value, format) {
            try {
                const validFormats = ['CODE128', 'CODE128A', 'CODE128B', 'CODE128C',
                                      'EAN13', 'EAN8', 'UPC', 'ITF14', 'CODE39', 'CODE93', 'Codabar'];
                if (!validFormats.includes(format)) {
                    format = 'CODE128';
                }

                const height = parseInt(document.getElementById('barcodeHeight').value) || 80;
                const showValue = document.getElementById('showValue').value === 'true';

                // 对于EAN13/UPC等需要校验位的格式，先尝试CODE128，如果失败再用原格式
                let actualFormat = format;
                if (['EAN13', 'EAN8', 'UPC', 'ITF14'].includes(format)) {
                    try {
                        // 先用CODE128尝试生成
                        const testSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                        JsBarcode(testSvg, value, {
                            format: 'CODE128',
                            height: height,
                            width: 2,
                            displayValue: false,
                            margin: 10
                        });
                        // 如果CODE128成功，用CODE128
                        actualFormat = 'CODE128';
                    } catch (e) {
                        // CODE128失败，保持原格式
                    }
                }

                // 先创建临时SVG获取条码尺寸
                const tempSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                JsBarcode(tempSvg, value, {
                    format: actualFormat,
                    height: height,
                    width: 2,
                    displayValue: false, // 不使用内置的数字显示
                    margin: 10,
                    background: '#ffffff',
                    lineColor: '#000000'
                });

                // 获取条码的实际尺寸
                const barcodeWidth = tempSvg.getAttribute('width') || 200;
                const barcodeHeight = tempSvg.getAttribute('height') || 120;

                // 数字区域高度
                const textHeight = showValue ? 35 : 0;
                const padding = 15;

                // 创建整合后的SVG（数字在上，条码在下）
                const finalSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                finalSvg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
                finalSvg.setAttribute('width', parseInt(barcodeWidth) + padding * 2);
                finalSvg.setAttribute('height', parseInt(barcodeHeight) + textHeight + padding * 2);
                finalSvg.setAttribute('viewBox', `0 0 ${parseInt(barcodeWidth) + padding * 2} ${parseInt(barcodeHeight) + textHeight + padding * 2}`);

                // 添加背景
                const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                bg.setAttribute('width', '100%');
                bg.setAttribute('height', '100%');
                bg.setAttribute('fill', '#ffffff');
                finalSvg.appendChild(bg);

                // 添加条码
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.setAttribute('transform', `translate(${padding}, ${padding})`);
                g.innerHTML = tempSvg.innerHTML;
                finalSvg.appendChild(g);

                // 添加数字（放在条码下方）
                if (showValue) {
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', (parseInt(barcodeWidth) + padding * 2) / 2);
                    text.setAttribute('y', parseInt(barcodeHeight) + padding + 30);
                    text.setAttribute('text-anchor', 'middle');
                    text.setAttribute('font-family', 'Arial, Helvetica, sans-serif');
                    text.setAttribute('font-size', '18');
                    text.setAttribute('font-weight', 'bold');
                    text.setAttribute('fill', '#000000');
                    text.textContent = value;
                    finalSvg.appendChild(text);
                }

                return finalSvg;
            } catch (e) {
                console.error('生成条码失败:', value, e);
                return null;
            }
        }

        function generateBarcodes() {
            const input = document.getElementById('barcodeInput').value;
            if (!input.trim()) {
                showToast('请输入条码内容', 'error');
                return;
            }

            const values = parseInput(input);
            if (values.length === 0) {
                showToast('请输入有效的条码内容', 'error');
                return;
            }

            generatedBarcodes = [];
            let validCount = 0;
            let invalidCount = 0;

            values.forEach(value => {
                const format = detectFormat(value);
                const svg = generateBarcodeSVG(value, format);

                if (svg) {
                    generatedBarcodes.push({
                        value: value,
                        format: format,
                        svg: svg,
                        valid: true
                    });
                    validCount++;
                } else {
                    generatedBarcodes.push({
                        value: value,
                        format: format,
                        svg: null,
                        valid: false
                    });
                    invalidCount++;
                }
            });

            renderBarcodes(validCount, invalidCount);
            showToast(`成功生成 ${validCount} 个条码`, 'success');
        }

        function renderBarcodes(validCount, invalidCount) {
            const previewSection = document.getElementById('previewSection');
            const emptyState = document.getElementById('emptyState');
            const grid = document.getElementById('barcodeGrid');
            const downloadAllBtn = document.getElementById('downloadAllBtn');

            document.getElementById('totalCount').textContent = generatedBarcodes.length;
            document.getElementById('validCount').textContent = validCount;
            document.getElementById('invalidCount').textContent = invalidCount;

            if (generatedBarcodes.length === 0) {
                previewSection.style.display = 'none';
                emptyState.style.display = 'block';
                downloadAllBtn.disabled = true;
                return;
            }

            previewSection.style.display = 'block';
            emptyState.style.display = 'none';
            downloadAllBtn.disabled = validCount === 0;

            grid.innerHTML = '';

            generatedBarcodes.forEach((barcode, index) => {
                const card = document.createElement('div');
                card.className = 'barcode-card';

                if (barcode.valid) {
                    const svgClone = barcode.svg.cloneNode(true);
                    // 调整预览尺寸
                    svgClone.style.width = '100%';
                    svgClone.style.height = 'auto';
                    svgClone.style.display = 'block';
                    card.appendChild(svgClone);
                } else {
                    card.innerHTML = '<div style="padding: 40px; color: var(--danger);">条码格式不支持</div>';
                }

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'barcode-actions';

                if (barcode.valid) {
                    const downloadBtn = document.createElement('button');
                    downloadBtn.className = 'btn-download-single';
                    downloadBtn.textContent = '下载此条码';
                    downloadBtn.onclick = () => downloadSingle(barcode);
                    actionsDiv.appendChild(downloadBtn);
                }

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn-delete';
                deleteBtn.textContent = '删除';
                deleteBtn.onclick = () => deleteBarcode(index);
                actionsDiv.appendChild(deleteBtn);

                card.appendChild(actionsDiv);
                grid.appendChild(card);
            });
        }

        function deleteBarcode(index) {
            generatedBarcodes.splice(index, 1);
            const validCount = generatedBarcodes.filter(b => b.valid).length;
            const invalidCount = generatedBarcodes.filter(b => !b.valid).length;
            renderBarcodes(validCount, invalidCount);
            showToast('已删除该条码');
        }

        function svgToCanvas(svg, width, height) {
            return new Promise((resolve, reject) => {
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');

                const svgData = new XMLSerializer().serializeToString(svg);
                const img = new Image();

                img.onload = () => {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0);
                    resolve(canvas);
                };

                img.onerror = reject;
                img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
            });
        }

        async function downloadSingle(barcode) {
            try {
                const svg = barcode.svg;

                // 使用 SVG 的实际尺寸属性
                const width = parseInt(svg.getAttribute('width')) || 300;
                const height = parseInt(svg.getAttribute('height')) || 150;

                const canvas = await svgToCanvas(svg, width, height);

                const link = document.createElement('a');
                link.download = `barcode_${barcode.value}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                showToast('下载成功', 'success');
            } catch (e) {
                console.error('下载失败:', e);
                showToast('下载失败，请重试', 'error');
            }
        }

        async function downloadAll() {
            const validBarcodes = generatedBarcodes.filter(b => b.valid);
            if (validBarcodes.length === 0) {
                showToast('没有可下载的条码', 'error');
                return;
            }

            if (validBarcodes.length === 1) {
                downloadSingle(validBarcodes[0]);
                return;
            }

            showToast('正在打包，请稍候...', 'info');

            try {
                const zip = new JSZip();

                for (let i = 0; i < validBarcodes.length; i++) {
                    const barcode = validBarcodes[i];
                    const svg = barcode.svg;

                    // 使用 SVG 的实际尺寸属性
                    const width = parseInt(svg.getAttribute('width')) || 300;
                    const height = parseInt(svg.getAttribute('height')) || 150;

                    const canvas = await svgToCanvas(svg, width, height);
                    const dataUrl = canvas.toDataURL('image/png');
                    const base64 = dataUrl.split(',')[1];

                    // 清理文件名中的特殊字符
                    const safeValue = barcode.value.replace(/[^a-zA-Z0-9_-]/g, '_');
                    zip.file(`barcode_${safeValue}.png`, base64, { base64: true });
                }

                const content = await zip.generateAsync({ type: 'blob' });
                const link = document.createElement('a');
                link.download = `barcodes_${new Date().toISOString().slice(0, 10)}.zip`;
                link.href = URL.createObjectURL(content);
                link.click();
                URL.revokeObjectURL(link.href);

                showToast(`成功打包 ${validBarcodes.length} 个条码`, 'success');
            } catch (e) {
                console.error('打包失败:', e);
                showToast('打包失败，请重试', 'error');
            }
        }

        function clearAll() {
            generatedBarcodes = [];
            document.getElementById('barcodeInput').value = '';
            document.getElementById('previewSection').style.display = 'none';
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('downloadAllBtn').disabled = true;
            showToast('已清空所有内容');
        }
    </script>

    <script>
      (function () {
        var btn = document.getElementById('themeToggle');
        if (!btn) return;
        function syncIcon() {
          var isDark = document.documentElement.classList.contains('dark');
          btn.querySelector('.theme-toggle-icon').textContent = isDark ? '☀️' : '🌙';
          btn.title = isDark ? '切换到浅色' : '切换到深色';
        }
        function applyTheme(t) {
          if (t === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
          try { localStorage.setItem('theme', t); } catch (e) {}
          syncIcon();
          if (typeof window.__onThemeChange === 'function') window.__onThemeChange(t);
        }
        btn.addEventListener('click', function () {
          applyTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
        });
        syncIcon();
      })();
    </script>

    <script>
      /* ========== 中英切换 ==========
         机制：页面里保留中文原文，MAP 是「中文 → 英文」的对照表。
         切换时遍历文本节点与 placeholder / title / aria-label 做替换，
         首次替换前把原文存到节点上，切回中文时还原（不会翻译两次）。
         JS 动态插入的提示、选项、Toast 由 MutationObserver 补翻。
      */
      (function () {
        var KEY = 'lang';
        var REPO = 'https://github.com/isnotry/MiniTools';
        var MAP = {
          "面包屑导航": "Breadcrumb",
          "条码生成器 · 批量生成 CODE128 / EAN13 | MiniTools": "Barcode Generator · Bulk CODE128 / EAN13 | MiniTools",
          "在浏览器里批量生成 CODE128、EAN13、UPC、CODE39 等格式条码，可自定义条宽、高度、字号与边距，支持逐条下载 PNG 或打包成 ZIP，数据本地处理不上传。": "Generate CODE128, EAN13, UPC and CODE39 barcodes in bulk, with adjustable bar width, height, font size and margins. Download each barcode as PNG or all of them as a ZIP — everything stays on your machine.",
          "在 GitHub 上给项目加星": "Star this project on GitHub",
          "条码生成器": "Barcode Generator",
          "快速生成条码图片，一键保存全部": "Generate barcode images quickly, then save them all at once",
          "条码录入": "Barcode Input",
          "输入条码（每行一个，或用逗号/空格分隔）": "Enter barcodes (one per line, or separated by commas / spaces)",
          "支持 CODE128、EAN-13、UPC-A 等多种格式": "Supports CODE128, EAN-13, UPC-A and more",
          "条码类型": "Barcode type",
          "CODE128（推荐，支持任意字符）": "CODE128 (recommended, any characters)",
          "CODE128A（大写字母+数字）": "CODE128A (uppercase letters + digits)",
          "CODE128B（通用）": "CODE128B (general purpose)",
          "CODE128C（纯数字，高密度）": "CODE128C (digits only, high density)",
          "EAN-13（商品条码）": "EAN-13 (retail product)",
          "EAN-8（8位商品码）": "EAN-8 (8-digit product code)",
          "UPC-A（美国商品码）": "UPC-A (US product code)",
          "ITF-14（物流箱码）": "ITF-14 (shipping carton)",
          "CODE39（工业用）": "CODE39 (industrial)",
          "条形高度": "Bar height",
          "显示文字": "Show text",
          "显示条码数字": "Show barcode number",
          "不显示": "Hidden",
          "自动识别不同条码格式（EAN13/UPC优先）": "Auto-detect barcode format (EAN13 / UPC first)",
          "生成条码": "Generate barcodes",
          "一键保存全部": "Save all",
          "清空": "Clear",
          "条码预览": "Barcode preview",
          "个条码": "barcodes",
          "个有效": "valid",
          "个无效": "invalid",
          "在上方输入条码内容，然后点击\"生成条码\"": "Enter barcodes above, then click \"Generate barcodes\"",
          "请输入条码内容": "Please enter barcode content",
          "请输入有效的条码内容": "Please enter valid barcode content",
          "下载此条码": "Download",
          "删除": "Delete",
          "条码格式不支持": "Unsupported barcode format",
          "已删除该条码": "Barcode deleted",
          "下载成功": "Downloaded",
          "下载失败，请重试": "Download failed, please try again",
          "没有可下载的条码": "No barcodes to download",
          "正在打包，请稍候...": "Packing, please wait…",
          "已清空所有内容": "All cleared",
          "打包失败，请重试": "Packing failed, please try again",
          "切换深色 / 浅色模式": "Toggle dark / light mode",
          "切换主题": "Switch theme",
          "切换到浅色": "Switch to light",
          "切换到深色": "Switch to dark"
        };
        var PAIRS = [
          ["成功生成", "Generated"],
          ["成功打包", "Packed"],
          ["个条码", "barcodes"],
          ["条码格式不支持", "Unsupported barcode format"],
          ["生成条码", "Generate barcodes"],
          ["例如：", "e.g."]
        ];

        var CJK = /[\u4e00-\u9fff\uff00-\uffef]/;
        var busy = false;
        var mo = null;
        var MO_OPT = { childList: true, subtree: true, characterData: true };
        function pause(fn) {
          if (busy) return;
          busy = true;
          try {
            if (mo) mo.disconnect();
            fn();
          } finally {
            if (mo) { try { mo.observe(document.body, MO_OPT); } catch (e) {} }
            busy = false;
          }
        }

        function detect() {
          try {
            var v = localStorage.getItem(KEY);
            if (v === 'zh' || v === 'en') return v;
          } catch (e) {}
          return (navigator.language || '').toLowerCase().indexOf('en') === 0 ? 'en' : 'zh';
        }
        var lang = detect();

        function tr(s) {
          s = String(s);
          var t = s.trim();
          if (MAP[t] != null) return s.replace(t, MAP[t]);
          var out = s;
          for (var i = 0; i < PAIRS.length; i++) {
            if (out.indexOf(PAIRS[i][0]) >= 0) out = out.split(PAIRS[i][0]).join(PAIRS[i][1]);
          }
          return out;
        }

        function applyText(node) {
          if (!node || node.nodeType !== 3) return;
          var v = node.nodeValue;
          if (!v) return;
          if (node.__mt_orig == null) {
            if (!CJK.test(v)) return;
            node.__mt_orig = v;
          }
          var nv = lang === 'en' ? tr(node.__mt_orig) : node.__mt_orig;
          if (nv !== v) node.nodeValue = nv;
        }

        function applyAttrs(el) {
          if (!el || el.nodeType !== 1) return;
          ['placeholder', 'title', 'aria-label'].forEach(function (a) {
            if (!el.hasAttribute(a)) return;
            var v = el.getAttribute(a);
            if (!v) return;
            var k = '__mt_' + a;
            if (el[k] == null) {
              if (!CJK.test(v)) return;
              el[k] = v;
            }
            var nv = lang === 'en' ? tr(el[k]) : el[k];
            if (nv !== v) el.setAttribute(a, nv);
          });
        }

        function walk(root) {
          var tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
          var list = [], n;
          while ((n = tw.nextNode())) list.push(n);
          list.forEach(applyText);
          var els = [];
          if (root.nodeType === 1) {
            els.push(root);
            els = els.concat(Array.prototype.slice.call(root.querySelectorAll('*')));
          }
          els.forEach(applyAttrs);
        }

        function refresh() {
          pause(function () { walk(document.body); });
        }

        window.mtT = function (s) { return lang === 'en' ? tr(s) : s; };

        if (window.MutationObserver) {
          mo = new MutationObserver(function (muts) {
            pause(function () {
              muts.forEach(function (m) {
                if (m.type === 'childList') {
                  for (var i = 0; i < m.addedNodes.length; i++) {
                    var a = m.addedNodes[i];
                    if (a.nodeType === 3) applyText(a);
                    else if (a.nodeType === 1) walk(a);
                  }
                } else if (m.type === 'characterData') applyText(m.target);
              });
            });
          });
          mo.observe(document.body, MO_OPT);
        }

        function mountStyle() {
          if (document.getElementById('mt-lang-style')) return;
          var st = document.createElement('style');
          st.id = 'mt-lang-style';
st.textContent =
            '.mt-actions{position:fixed;top:16px;right:max(var(--space-4, 16px), calc((100% - var(--mt-shell, 1400px)) / 2 + var(--space-4, 16px)));z-index:1100;display:flex;align-items:center;gap:8px;}' +
            '.mt-actions.inline{position:static;margin-left:auto;}' +
            '.mt-actions>.theme-toggle{position:static;top:auto;right:auto;left:auto;bottom:auto;margin:0;flex:none;}' +
            '.mt-star{height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--gray-200,#eaeaea);background:var(--background,#fff);color:var(--foreground,#171717);font-family:inherit;text-decoration:none;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .2s,border-color .2s,transform .2s;}' +
            '.mt-star:hover{border-color:var(--gray-300,#d4d4d4);transform:scale(1.05);color:var(--foreground,#171717);}' +
            '.mt-star svg{width:15px;height:15px;fill:currentColor;display:block;}' +
            '.mt-lang{height:40px;min-width:46px;padding:0 12px;border-radius:999px;border:1px solid var(--gray-200,#eaeaea);background:var(--background,#fff);color:var(--foreground,#171717);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,transform .2s;}' +
            '.mt-lang:hover{border-color:var(--gray-300,#d4d4d4);transform:scale(1.05);}' +
            '.mt-actions.inline .mt-star,.mt-actions.inline .mt-lang{height:36px;}' +
            '@media (max-width: 640px){.mt-star span{display:none;}.mt-star{padding:0 10px;}}' +
            '@media (hover: none){.mt-star:hover,.mt-lang:hover{transform:none;}}';
                    document.head.appendChild(st);
        }

        function syncDoc() {
          document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
          var b = document.getElementById('langToggle');
          if (b) {
            b.textContent = lang === 'en' ? '中' : 'EN';
            var t = lang === 'en' ? 'Switch to Chinese' : 'Switch to English';
            b.setAttribute('title', t);
            b.setAttribute('aria-label', t);
          }
          if (document.__mt_title == null) document.__mt_title = document.title;
          document.title = lang === 'en' ? tr(document.__mt_title) : document.__mt_title;
          var md = document.querySelector('meta[name="description"]');
          if (md) {
            if (md.__mt_orig == null) md.__mt_orig = md.getAttribute('content');
            md.setAttribute('content', lang === 'en' ? tr(md.__mt_orig) : md.__mt_orig);
          }
        }

        function mount() {
          mountStyle();
          var tt = document.getElementById('themeToggle');
          if (!tt || document.getElementById('langToggle')) return;
          var inline = window.getComputedStyle(tt).position !== 'fixed';
          var box = document.createElement('div');
          box.className = 'mt-actions' + (inline ? ' inline' : '');
          tt.parentNode.insertBefore(box, tt);
          box.appendChild(tt);

          var star = document.createElement('a');
          star.className = 'mt-star';
          star.id = 'starLink';
          star.href = REPO;
          star.target = '_blank';
          star.rel = 'noopener noreferrer';
          star.setAttribute('title', '在 GitHub 上给项目加星');
          star.setAttribute('aria-label', '在 GitHub 上给项目加星');
          star.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg><span>Star</span>';
          box.insertBefore(star, tt);

          var btn = document.createElement('button');
          btn.className = 'mt-lang';
          btn.id = 'langToggle';
          btn.type = 'button';
          btn.addEventListener('click', function () {
            lang = lang === 'en' ? 'zh' : 'en';
            try { localStorage.setItem(KEY, lang); } catch (e) {}
            refresh();
            syncDoc();
          });
          box.insertBefore(btn, tt);
        }

        mount();
        refresh();
        syncDoc();
        window.addEventListener('load', function () { refresh(); syncDoc(); });
      })();
    </script>
