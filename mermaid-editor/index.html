<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流程图编辑器</title>
    <script src="vendor/mermaid.min.js"></script>
    <style>
        :root {
            --background: #ffffff;
            --background-subtle: #fafafa;
            --background-muted: #f5f5f5;
            --foreground: #171717;
            --foreground-secondary: #666666;
            --foreground-tertiary: #999999;
            --gray-200: #eaeaea;
            --gray-300: #d4d4d4;
            --gray-700: #333333;
            --accent: #0070f3;
            --accent-hover: #0061d5;
            --accent-subtle: #f0f7ff;
            --danger: #d00;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            --font-mono: "SF Mono", "Monaco", "Menlo", "Ubuntu Mono", "Consolas", monospace;
            --text-xs: 12px; --text-sm: 13px; --text-base: 14px;
            --text-md: 16px; --text-lg: 20px; --text-xl: 28px;
            --radius: 8px;
            --radius-sm: 6px;
            --radius-pill: 128px;
            --button-primary-hover: #383838;
            --button-secondary-hover: #f2f2f2;
            --space-2: 8px;
            --space-3: 16px;
            --space-4: 24px;
        }

        /* 暗色模式 token：由 <html class="dark"> 驱动，JS 根据系统偏好或手动切换设置 */
        :root.dark {
            --background: #0a0a0a;
            --background-subtle: #111111;
            --background-muted: #1a1a1a;
            --foreground: #ededed;
            --foreground-secondary: #a0a0a0;
            --foreground-tertiary: #666666;
            --gray-200: #333333;
            --gray-300: #444444;
            --gray-700: #cccccc;
            --accent: #0070f3;
            --accent-hover: #3291ff;
            --accent-subtle: #0a2540;
            --danger: #ff6b6b;
            --danger-subtle: #3a1d1d;
            --button-primary-hover: #ccc;
            --button-secondary-hover: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            color: var(--foreground);
            background: var(--background);
            height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .header {
            background: var(--background);
            color: var(--foreground);
            padding: var(--space-3) var(--space-4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--gray-200);
        }

        .header-titles { display: flex; flex-direction: column; gap: 2px; }

        .header h1 {
            font-size: var(--text-lg);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0;
        }

        .header .subtitle {
            font-size: var(--text-sm);
            color: var(--foreground-secondary);
            margin: 0;
        }

        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--gray-200);
        }

        .panel-header {
            background: var(--background);
            padding: var(--space-3) var(--space-4);
            border-bottom: 1px solid var(--gray-200);
            font-weight: 600;
            color: var(--foreground);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .save-btn {
            padding: 8px 16px;
            background: var(--foreground);
            color: var(--background);
            border: 1px solid transparent;
            border-radius: var(--radius-pill);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background .2s;
        }

        .save-btn:hover {
            background: var(--button-primary-hover);
        }

        .editor-container {
            flex: 1;
            position: relative;
        }

        #code-editor {
            width: 100%;
            height: 100%;
            border: none;
            padding: var(--space-4);
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            background: var(--background-muted);
            color: var(--foreground);
            outline: none;
        }

        .preview-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .preview-container {
            flex: 1;
            background: var(--background);
            padding: var(--space-4);
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mermaid-wrapper {
            cursor: zoom-in;
            transition: transform .2s;
            padding: var(--space-3);
        }

        .mermaid-wrapper:hover {
            transform: scale(1.02);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            overflow: hidden;
        }

        .modal.active {
            display: block;
        }

        .modal-content-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .modal-content {
            transform-origin: center center;
            will-change: transform;
            cursor: grab;
        }

        .modal-content:active {
            cursor: grabbing;
        }

        .modal-close {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            transition: all .2s;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 1);
            transform: scale(1.1);
        }

        .zoom-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: #666;
            z-index: 1001;
        }

        .error-message {
            display: none;
            background: var(--danger-subtle);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px var(--space-4);
            margin: var(--space-3) var(--space-4);
            border-radius: var(--radius);
            font-size: 14px;
        }

        .error-message.show {
            display: block;
        }

        /* 右上角主题切换按钮（全屏应用放入顶栏右侧，使用 inline 静态定位） */
        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1100;
            width: 40px;
            height: 40px;
            border-radius: var(--radius-full);
            border: 1px solid var(--gray-200);
            background: var(--background);
            color: var(--foreground);
            font-size: 18px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background .2s, border-color .2s, transform .2s;
        }
        .theme-toggle:hover { border-color: var(--gray-300); transform: scale(1.05); }
        .theme-toggle.inline { position: static; width: 36px; height: 36px; }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
</head>
<body>
        <div class="header">
            <div class="header-titles">
                <h1>流程图编辑器</h1>
                <p class="subtitle">实时预览 Mermaid 图表，一键导出 PNG</p>
            </div>
            <button class="theme-toggle inline" id="themeToggle" type="button" aria-label="切换深色 / 浅色模式" title="切换主题">
                <span class="theme-toggle-icon">🌙</span>
            </button>
        </div>

    <div class="main">
        <div class="preview-panel">
            <div class="panel-header">
                预览
                <button class="save-btn" id="save-png-btn">下载 PNG</button>
            </div>
            <div id="error-message" class="error-message"></div>
            <div class="preview-container">
                <div class="mermaid-wrapper" id="mermaid-preview"></div>
            </div>
        </div>

        <div class="editor-panel">
            <div class="panel-header">代码编辑器</div>
            <div class="editor-container">
                <textarea id="code-editor" placeholder="在此输入 Mermaid 代码，例如：
graph TD
    A[开始] --> B[处理]
    B --> C{判断}
    C -->|是| D[完成]
    C -->|否| B"></textarea>
            </div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content-wrapper">
            <div class="modal-content" id="modal-content"></div>
        </div>
        <button class="modal-close" id="modal-close">×</button>
        <div class="zoom-hint">🔍 滚轮缩放 | 拖拽移动 | ESC 关闭</div>
    </div>

    <script>
        // 初始化 Mermaid（依据当前主题选择 default / dark）
        var isDark = document.documentElement.classList.contains('dark');
        mermaid.initialize({
            startOnLoad: false,
            theme: isDark ? 'dark' : 'default',
            securityLevel: 'loose',
        });

        // 主题切换时同步 Mermaid 主题并重渲染（由切换脚本调用）
        window.__onThemeChange = function (theme) {
            var dark = theme === 'dark';
            mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default', securityLevel: 'loose' });
            renderMermaid();
        };

        const codeEditor = document.getElementById('code-editor');
        const mermaidPreview = document.getElementById('mermaid-preview');
        const errorMessage = document.getElementById('error-message');
        const modal = document.getElementById('modal');
        const modalContent = document.getElementById('modal-content');
        const modalClose = document.getElementById('modal-close');
        const savePngBtn = document.getElementById('save-png-btn');

        let debounceTimer;

        // 缩放和拖拽状态
        let scale = 1;
        let translateX = 0;
        let translateY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        // 防抖渲染函数
        function debounceRender() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(renderMermaid, 500);
        }

        // 渲染 Mermaid 图表
        async function renderMermaid() {
            const code = codeEditor.value.trim();

            if (!code) {
                mermaidPreview.innerHTML = '<p style="color: #999;">请输入 Mermaid 代码</p>';
                errorMessage.classList.remove('show');
                return;
            }

            try {
                // 生成唯一的 ID
                const id = 'mermaid-' + Date.now();
                const { svg } = await mermaid.render(id, code);
                mermaidPreview.innerHTML = svg;
                errorMessage.classList.remove('show');
            } catch (error) {
                errorMessage.textContent = '渲染错误: ' + error.message;
                errorMessage.classList.add('show');
                mermaidPreview.innerHTML = '<p style="color: #d00;">图表渲染失败</p>';
            }
        }

        // 更新模态框内容的变换
        function updateModalTransform() {
            modalContent.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        // 点击放大
        mermaidPreview.addEventListener('click', () => {
            const svg = mermaidPreview.querySelector('svg');
            if (svg) {
                modalContent.innerHTML = svg.outerHTML;
                // 重置缩放和位置
                scale = 1;
                translateX = 0;
                translateY = 0;
                updateModalTransform();
                modal.classList.add('active');
            }
        });

        // 鼠标滚轮缩放
        modal.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            const newScale = scale * delta;

            // 限制缩放范围
            if (newScale >= 0.1 && newScale <= 10) {
                scale = newScale;
                updateModalTransform();
            }
        }, { passive: false });

        // 鼠标按下开始拖拽
        modalContent.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
            modalContent.style.cursor = 'grabbing';
        });

        // 鼠标移动
        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            updateModalTransform();
        });

        // 鼠标释放
        document.addEventListener('mouseup', () => {
            isDragging = false;
            modalContent.style.cursor = 'grab';
        });

        // 点击关闭模态框
        modalClose.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
            }
        });

        // 按 ESC 关闭模态框
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                modal.classList.remove('active');
            }
        });

        // 保存为 PNG
        savePngBtn.addEventListener('click', async () => {
            const svg = mermaidPreview.querySelector('svg');
            if (!svg) {
                alert('请先渲染图表');
                return;
            }

            try {
                // 获取 SVG 内容
                const svgData = new XMLSerializer().serializeToString(svg);

                // 创建 canvas
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                // 获取实际显示的尺寸
                const svgClone = svg.cloneNode(true);
                const bbox = svg.getBoundingClientRect();
                const viewBox = svg.getAttribute('viewBox');

                let width, height;
                if (viewBox) {
                    const parts = viewBox.split(/\s+/);
                    width = parseFloat(parts[2]);
                    height = parseFloat(parts[3]);
                } else {
                    width = bbox.width;
                    height = bbox.height;
                }

                // 确保有有效的尺寸
                if (!width || !height || width < 1 || height < 1) {
                    width = 800;
                    height = 600;
                }

                canvas.width = width;
                canvas.height = height;

                // 设置 SVG 属性
                svgClone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
                svgClone.setAttribute('width', width);
                svgClone.setAttribute('height', height);

                const svgString = new XMLSerializer().serializeToString(svgClone);

                // 使用 Data URL 而不是 Blob URL
                const dataUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgString)));

                await new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => {
                        // 白色背景
                        ctx.fillStyle = 'white';
                        ctx.fillRect(0, 0, width, height);
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve();
                    };
                    img.onerror = (e) => {
                        reject(e);
                    };
                    img.src = dataUrl;
                });

                // 下载 PNG
                const pngDataUrl = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                const timestamp = new Date().toISOString().slice(0, 19).replace(/[:-]/g, '');
                link.download = `mermaid-${timestamp}.png`;
                link.href = pngDataUrl;
                link.click();

            } catch (error) {
                console.error('保存失败:', error);
                alert('保存图片失败: ' + error.message);
            }
        });

        // 监听输入变化自动渲染
        codeEditor.addEventListener('input', debounceRender);

        // 初始渲染示例
        codeEditor.value = `graph TD
    A[开始] --> B[输入数据]
    B --> C{验证数据}
    C -->|有效| D[处理数据]
    C -->|无效| E[显示错误]
    E --> B
    D --> F[保存结果]
    F --> G[完成]
    G --> H[结束]`;

        // 页面加载后自动渲染
        window.addEventListener('load', renderMermaid);
    </script>

    <script>
      (function () {
        var btn = document.getElementById('themeToggle');
        if (!btn) return;
        function syncIcon() {
          var isDark = document.documentElement.classList.contains('dark');
          btn.querySelector('.theme-toggle-icon').textContent = isDark ? '☀️' : '🌙';
          btn.title = isDark ? '切换到浅色' : '切换到深色';
        }
        function applyTheme(t) {
          if (t === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
          try { localStorage.setItem('theme', t); } catch (e) {}
          syncIcon();
          if (typeof window.__onThemeChange === 'function') window.__onThemeChange(t);
        }
        btn.addEventListener('click', function () {
          applyTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
        });
        syncIcon();
      })();
    </script>
</body>
</html>
