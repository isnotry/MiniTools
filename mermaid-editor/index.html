    <script>
        // 初始化 Mermaid（依据当前主题选择 default / dark）
        var isDark = document.documentElement.classList.contains('dark');
        mermaid.initialize({
            startOnLoad: false,
            theme: isDark ? 'dark' : 'default',
            securityLevel: 'loose',
        });

        // 主题切换时同步 Mermaid 主题并重渲染（由切换脚本调用）
        window.__onThemeChange = function (theme) {
            var dark = theme === 'dark';
            mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default', securityLevel: 'loose' });
            renderMermaid();
        };

        const codeEditor = document.getElementById('code-editor');
        const mermaidPreview = document.getElementById('mermaid-preview');
        const errorMessage = document.getElementById('error-message');
        const modal = document.getElementById('modal');
        const modalContent = document.getElementById('modal-content');
        const modalClose = document.getElementById('modal-close');
        const savePngBtn = document.getElementById('save-png-btn');
        const saveSvgBtn = document.getElementById('save-svg-btn');

        // 文件名时间戳：mermaid-20260918T014600
        function fileStamp() {
            return new Date().toISOString().slice(0, 19).replace(/[:-]/g, '');
        }

        // 读取 SVG 固有尺寸：优先 viewBox，回退布局尺寸，最后兜底 800x600
        // viewBox 原点可能是负值（如 "-8 -8 w h"），因此保留 origin，不能一律按 0 处理
        function getSvgSize(svg) {
            const viewBox = svg.getAttribute('viewBox');
            if (viewBox) {
                const parts = viewBox.trim().split(/[\s,]+/).map(parseFloat);
                if (parts.length === 4 && parts[2] > 0 && parts[3] > 0) {
                    return { width: parts[2], height: parts[3], x: parts[0], y: parts[1] };
                }
            }
            const bbox = svg.getBoundingClientRect();
            if (bbox.width >= 1 && bbox.height >= 1) {
                return { width: bbox.width, height: bbox.height, x: 0, y: 0 };
            }
            return { width: 800, height: 600, x: 0, y: 0 };
        }

        // 准备一份可独立使用的 SVG 副本：补齐命名空间、固定尺寸、去掉 mermaid 的 max-width 约束
        function buildStandaloneSvg(svg) {
            const clone = svg.cloneNode(true);
            const box = getSvgSize(svg);

            clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
            clone.setAttribute('width', String(box.width));
            clone.setAttribute('height', String(box.height));
            clone.removeAttribute('style'); // mermaid 注入的 max-width 会让外部打开时被压缩
            if (!clone.getAttribute('viewBox')) {
                clone.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);
            }

            return { clone, box };
        }

        // 触发浏览器下载
        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.download = filename;
            link.href = url;
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        let debounceTimer;

        // 缩放和拖拽状态
        let scale = 1;
        let translateX = 0;
        let translateY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        // 防抖渲染函数
        function debounceRender() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(renderMermaid, 500);
        }

        // 渲染 Mermaid 图表
        async function renderMermaid() {
            const code = codeEditor.value.trim();

            if (!code) {
                mermaidPreview.innerHTML = '<p style="color: #999;">' + window.mtT('请输入 Mermaid 代码') + '</p>';
                errorMessage.classList.remove('show');
                return;
            }

            try {
                // 生成唯一的 ID
                const id = 'mermaid-' + Date.now();
                const { svg } = await mermaid.render(id, code);
                mermaidPreview.innerHTML = svg;
                errorMessage.classList.remove('show');
            } catch (error) {
                errorMessage.textContent = '渲染错误: ' + error.message;
                errorMessage.classList.add('show');
                mermaidPreview.innerHTML = '<p style="color: #d00;">' + window.mtT('图表渲染失败') + '</p>';
            }
        }

        // 更新模态框内容的变换
        function updateModalTransform() {
            modalContent.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        // 点击放大
        mermaidPreview.addEventListener('click', () => {
            const svg = mermaidPreview.querySelector('svg');
            if (svg) {
                modalContent.innerHTML = svg.outerHTML;
                // 重置缩放和位置
                scale = 1;
                translateX = 0;
                translateY = 0;
                updateModalTransform();
                modal.classList.add('active');
            }
        });

        // 鼠标滚轮缩放
        modal.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            const newScale = scale * delta;

            // 限制缩放范围
            if (newScale >= 0.1 && newScale <= 10) {
                scale = newScale;
                updateModalTransform();
            }
        }, { passive: false });

        // 鼠标按下开始拖拽
        modalContent.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
            modalContent.style.cursor = 'grabbing';
        });

        // 鼠标移动
        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            updateModalTransform();
        });

        // 鼠标释放
        document.addEventListener('mouseup', () => {
            isDragging = false;
            modalContent.style.cursor = 'grab';
        });

        // 点击关闭模态框
        modalClose.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
            }
        });

        // 按 ESC 关闭模态框
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                modal.classList.remove('active');
            }
        });

        // 下载为 SVG（矢量，可在 Figma / Illustrator / draw.io 中二次编辑）
        saveSvgBtn.addEventListener('click', () => {
            const svg = mermaidPreview.querySelector('svg');
            if (!svg) {
                alert(window.mtT('请先渲染图表'));
                return;
            }

            try {
                const { clone, box } = buildStandaloneSvg(svg);

                // 插入背景层：与当前预览主题一致，避免导出后文字看不清。不需要时删除该 rect 即可
                const isDark = document.documentElement.classList.contains('dark');
                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('id', 'background');
                rect.setAttribute('x', String(box.x));
                rect.setAttribute('y', String(box.y));
                rect.setAttribute('width', String(box.width));
                rect.setAttribute('height', String(box.height));
                rect.setAttribute('fill', isDark ? '#0a0a0a' : '#ffffff');
                clone.insertBefore(rect, clone.firstChild);

                const svgString = '<?xml version="1.0" encoding="UTF-8"?>\n' +
                    new XMLSerializer().serializeToString(clone);
                const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
                downloadBlob(blob, `mermaid-${fileStamp()}.svg`);
            } catch (error) {
                console.error('保存失败:', error);
                alert(window.mtT('保存 SVG 失败: ') + error.message);
            }
        });

        // 保存为 PNG
        savePngBtn.addEventListener('click', async () => {
            const svg = mermaidPreview.querySelector('svg');
            if (!svg) {
                alert(window.mtT('请先渲染图表'));
                return;
            }

            try {
                const { clone, box } = buildStandaloneSvg(svg);
                const width = box.width;
                const height = box.height;

                // 创建 canvas
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = Math.ceil(width);
                canvas.height = Math.ceil(height);

                const svgString = new XMLSerializer().serializeToString(clone);

                // 使用 Data URL 而不是 Blob URL
                const dataUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgString)));

                await new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => {
                        // 白色背景
                        ctx.fillStyle = 'white';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve();
                    };
                    img.onerror = (e) => {
                        reject(e);
                    };
                    img.src = dataUrl;
                });

                // 下载 PNG
                const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
                downloadBlob(blob, `mermaid-${fileStamp()}.png`);

            } catch (error) {
                console.error('保存失败:', error);
                alert(window.mtT('保存图片失败: ') + error.message);
            }
        });

        // 监听输入变化自动渲染
        codeEditor.addEventListener('input', debounceRender);

        // 初始渲染示例
        codeEditor.value = `graph TD
    A[Start] --> B[Enter data]
    B --> C{Validate data}
    C -->|Valid| D[Process data]
    C -->|Invalid| E[Show error]
    E --> B
    D --> F[Save result]
    F --> G[Finish]
    G --> H[End]`;

        // 页面加载后自动渲染
        window.addEventListener('load', renderMermaid);
    </script>

    <script>
      (function () {
        var btn = document.getElementById('themeToggle');
        if (!btn) return;
        function syncIcon() {
          var isDark = document.documentElement.classList.contains('dark');
          btn.querySelector('.theme-toggle-icon').textContent = isDark ? '☀️' : '🌙';
          btn.title = isDark ? '切换到浅色' : '切换到深色';
        }
        function applyTheme(t) {
          if (t === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
          try { localStorage.setItem('theme', t); } catch (e) {}
          syncIcon();
          if (typeof window.__onThemeChange === 'function') window.__onThemeChange(t);
        }
        btn.addEventListener('click', function () {
          applyTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
        });
        syncIcon();
      })();
    </script>

    <script>
    /* ========== 中英切换 ==========
       机制：页面里保留中文原文，MAP 是「中文 → 英文」的对照表。
       切换时遍历文本节点与 placeholder / title / aria-label 做替换，
       首次替换前把原文存到节点上，切回中文时还原（不会翻译两次）。
       JS 动态插入的提示、选项、Toast 由 MutationObserver 补翻。
    */
    (function () {
      var KEY = 'lang';
      var REPO = 'https://github.com/isnotry/MiniTools';
      var MAP = {
        "面包屑导航": "Breadcrumb",
        "流程图编辑器 · Mermaid 在线编辑与导出 | MiniTools": "Flowchart Editor · Mermaid Editing and Export | MiniTools",
        "在线编写 Mermaid 图表并实时预览，支持流程图、时序图、类图等多种类型，可缩放拖拽查看，一键导出 PNG 或 SVG，本地处理不上传。": "Write Mermaid diagrams and preview them live — flowcharts, sequence diagrams, class diagrams and more. Zoom and pan around the canvas, then export PNG or SVG. Everything runs locally.",
        "在 GitHub 上给项目加星": "Star this project on GitHub",
        "流程图编辑器": "Flowchart Editor",
        "实时预览 Mermaid 图表，一键导出 PNG / SVG": "Live Mermaid preview, export PNG / SVG in one click",
        "预览": "Preview",
        "下载 SVG": "Download SVG",
        "下载 PNG": "Download PNG",
        "代码编辑器": "Code Editor",
        "🔍 滚轮缩放 | 拖拽移动 | ESC 关闭": "🔍 Scroll to zoom | Drag to move | ESC to close",
        "请输入 Mermaid 代码": "Enter Mermaid code to start",
        "图表渲染失败": "Failed to render the diagram",
        "请先渲染图表": "Render the diagram first",
        "保存 SVG 失败:": "Failed to save SVG:",
        "保存图片失败:": "Failed to save the image:",
        "保存失败:": "Save failed:",
        "在此输入 Mermaid 代码，例如：\ngraph TD\n    A[开始] --> B[处理]\n    B --> C{判断}\n    C -->|是| D[完成]\n    C -->|否| B": "Enter Mermaid code here, e.g.:\ngraph TD\n    A[Start] --> B[Process]\n    B --> C{Check}\n    C -->|Yes| D[Done]\n    C -->|No| B",
        "切换深色 / 浅色模式": "Toggle dark / light mode",
        "切换主题": "Switch theme",
        "切换到浅色": "Switch to light",
        "切换到深色": "Switch to dark"
      };
      var PAIRS = [
        ["渲染错误:", "Render error:"],
        ["在此输入 Mermaid 代码，例如：", "Enter Mermaid code here, e.g.:"]
      ];

      var CJK = /[\u4e00-\u9fff\uff00-\uffef]/;
      var busy = false;
      var mo = null;
      var MO_OPT = { childList: true, subtree: true, characterData: true };
      function pause(fn) {
        if (busy) return;
        busy = true;
        try {
          if (mo) mo.disconnect();
          fn();
        } finally {
          if (mo) { try { mo.observe(document.body, MO_OPT); } catch (e) {} }
          busy = false;
        }
      }

      function detect() {
        try {
          var v = localStorage.getItem(KEY);
          if (v === 'zh' || v === 'en') return v;
        } catch (e) {}
        return (navigator.language || '').toLowerCase().indexOf('en') === 0 ? 'en' : 'zh';
      }
      var lang = detect();

      function tr(s) {
        s = String(s);
        var t = s.trim();
        if (MAP[t] != null) return s.replace(t, MAP[t]);
        var out = s;
        for (var i = 0; i < PAIRS.length; i++) {
          if (out.indexOf(PAIRS[i][0]) >= 0) out = out.split(PAIRS[i][0]).join(PAIRS[i][1]);
        }
        return out;
      }

      function applyText(node) {
        if (!node || node.nodeType !== 3) return;
        var v = node.nodeValue;
        if (!v) return;
        if (node.__mt_orig == null) {
          if (!CJK.test(v)) return;
          node.__mt_orig = v;
        }
        var nv = lang === 'en' ? tr(node.__mt_orig) : node.__mt_orig;
        if (nv !== v) node.nodeValue = nv;
      }

      function applyAttrs(el) {
        if (!el || el.nodeType !== 1) return;
        ['placeholder', 'title', 'aria-label'].forEach(function (a) {
          if (!el.hasAttribute(a)) return;
          var v = el.getAttribute(a);
          if (!v) return;
          var k = '__mt_' + a;
          if (el[k] == null) {
            if (!CJK.test(v)) return;
            el[k] = v;
          }
          var nv = lang === 'en' ? tr(el[k]) : el[k];
          if (nv !== v) el.setAttribute(a, nv);
        });
      }

      function walk(root) {
        var tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
        var list = [], n;
        while ((n = tw.nextNode())) list.push(n);
        list.forEach(applyText);
        var els = [];
        if (root.nodeType === 1) {
          els.push(root);
          els = els.concat(Array.prototype.slice.call(root.querySelectorAll('*')));
        }
        els.forEach(applyAttrs);
      }

      function refresh() {
        pause(function () { walk(document.body); });
      }

      window.mtT = function (s) { return lang === 'en' ? tr(s) : s; };

      if (window.MutationObserver) {
        mo = new MutationObserver(function (muts) {
          pause(function () {
            muts.forEach(function (m) {
              if (m.type === 'childList') {
                for (var i = 0; i < m.addedNodes.length; i++) {
                  var a = m.addedNodes[i];
                  if (a.nodeType === 3) applyText(a);
                  else if (a.nodeType === 1) walk(a);
                }
              } else if (m.type === 'characterData') applyText(m.target);
            });
          });
        });
        mo.observe(document.body, MO_OPT);
      }

      function mountStyle() {
        if (document.getElementById('mt-lang-style')) return;
        var st = document.createElement('style');
        st.id = 'mt-lang-style';
st.textContent =
          '.mt-actions{position:fixed;top:16px;right:max(var(--space-4, 16px), calc((100% - var(--mt-shell, 1400px)) / 2 + var(--space-4, 16px)));z-index:1100;display:flex;align-items:center;gap:8px;}' +
          '.mt-actions.inline{position:static;margin-left:auto;}' +
          '.mt-actions>.theme-toggle{position:static;top:auto;right:auto;left:auto;bottom:auto;margin:0;flex:none;}' +
          '.mt-star{height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--gray-200,#eaeaea);background:var(--background,#fff);color:var(--foreground,#171717);font-family:inherit;text-decoration:none;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .2s,border-color .2s,transform .2s;}' +
          '.mt-star:hover{border-color:var(--gray-300,#d4d4d4);transform:scale(1.05);color:var(--foreground,#171717);}' +
          '.mt-star svg{width:15px;height:15px;fill:currentColor;display:block;}' +
          '.mt-lang{height:40px;min-width:46px;padding:0 12px;border-radius:999px;border:1px solid var(--gray-200,#eaeaea);background:var(--background,#fff);color:var(--foreground,#171717);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,transform .2s;}' +
          '.mt-lang:hover{border-color:var(--gray-300,#d4d4d4);transform:scale(1.05);}' +
          '.mt-actions.inline .mt-star,.mt-actions.inline .mt-lang{height:36px;}' +
          '@media (max-width: 640px){.mt-star span{display:none;}.mt-star{padding:0 10px;}}' +
          '@media (hover: none){.mt-star:hover,.mt-lang:hover{transform:none;}}';
                document.head.appendChild(st);
      }

      function syncDoc() {
        document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
        var b = document.getElementById('langToggle');
        if (b) {
          b.textContent = lang === 'en' ? '中' : 'EN';
          var t = lang === 'en' ? 'Switch to Chinese' : 'Switch to English';
          b.setAttribute('title', t);
          b.setAttribute('aria-label', t);
        }
        if (document.__mt_title == null) document.__mt_title = document.title;
        document.title = lang === 'en' ? tr(document.__mt_title) : document.__mt_title;
        var md = document.querySelector('meta[name="description"]');
        if (md) {
          if (md.__mt_orig == null) md.__mt_orig = md.getAttribute('content');
          md.setAttribute('content', lang === 'en' ? tr(md.__mt_orig) : md.__mt_orig);
        }
      }

      function mount() {
        mountStyle();
        var tt = document.getElementById('themeToggle');
        if (!tt || document.getElementById('langToggle')) return;
        var inline = window.getComputedStyle(tt).position !== 'fixed';
        var box = document.createElement('div');
        box.className = 'mt-actions' + (inline ? ' inline' : '');
        tt.parentNode.insertBefore(box, tt);
        box.appendChild(tt);

        var star = document.createElement('a');
        star.className = 'mt-star';
        star.id = 'starLink';
        star.href = REPO;
        star.target = '_blank';
        star.rel = 'noopener noreferrer';
        star.setAttribute('title', '在 GitHub 上给项目加星');
        star.setAttribute('aria-label', '在 GitHub 上给项目加星');
        star.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg><span>Star</span>';
        box.insertBefore(star, tt);

        var btn = document.createElement('button');
        btn.className = 'mt-lang';
        btn.id = 'langToggle';
        btn.type = 'button';
        btn.addEventListener('click', function () {
          lang = lang === 'en' ? 'zh' : 'en';
          try { localStorage.setItem(KEY, lang); } catch (e) {}
          refresh();
          syncDoc();
        });
        box.insertBefore(btn, tt);
      }

      mount();
      refresh();
      syncDoc();
      window.addEventListener('load', function () { refresh(); syncDoc(); });
    })();
    </script>
</body>
