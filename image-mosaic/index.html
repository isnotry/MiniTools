<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片涂抹打码</title>
    <style>
        :root {
            --background: #ffffff;
            --background-subtle: #fafafa;
            --background-muted: #f5f5f5;
            --foreground: #171717;
            --foreground-secondary: #666666;
            --foreground-tertiary: #999999;
            --gray-200: #eaeaea;
            --gray-300: #d4d4d4;
            --gray-700: #333333;
            --accent: #0070f3;
            --accent-hover: #0061d5;
            --accent-subtle: #f0f7ff;
            --danger: #d00;
            --danger-subtle: #ffe0e0;
            --button-primary-hover: #383838;
            --button-secondary-hover: #f2f2f2;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            --font-mono: "SF Mono", "Monaco", "Menlo", "Ubuntu Mono", "Consolas", monospace;
            --text-xs: 12px; --text-sm: 13px; --text-base: 14px;
            --text-md: 16px; --text-lg: 20px; --text-xl: 28px;
            --radius: 8px; --radius-sm: 6px;
            --radius-pill: 128px; --radius-full: 9999px;
            --space-1: 4px; --space-2: 8px; --space-3: 16px;
            --space-4: 24px; --space-5: 32px;
        
    --mt-shell: 1400px;
  }
        :root.dark {
            --background: #0a0a0a;
            --background-subtle: #111111;
            --background-muted: #1a1a1a;
            --foreground: #ededed;
            --foreground-secondary: #a0a0a0;
            --foreground-tertiary: #666666;
            --gray-200: #333333;
            --gray-300: #444444;
            --gray-700: #cccccc;
            --accent: #0070f3;
            --accent-hover: #3291ff;
            --accent-subtle: #0a2540;
            --danger: #ff6b6b;
            --danger-subtle: #3a1d1d;
            --button-primary-hover: #ccc;
            --button-secondary-hover: #1a1a1a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            color: var(--foreground);
            background: var(--background-subtle);
            min-height: 100vh;
            padding: var(--space-4);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: var(--space-5); }
        .header h1 { font-size: var(--text-xl); font-weight: 700; letter-spacing: -0.02em; margin-bottom: var(--space-2); }
        .header .subtitle { color: var(--foreground-secondary); font-size: var(--text-base); }

        .layout { display: grid; grid-template-columns: 360px 1fr; gap: var(--space-4); align-items: start; }
        @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

        .card {
            background: var(--background);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            padding: var(--space-4);
        }
        .card h2 { margin-bottom: var(--space-3); font-size: var(--text-md); font-weight: 600; letter-spacing: -0.01em; }
        .card h2 + h2 { margin-top: 24px; }

        /* 上传区 */
        .dropzone {
            border: 1px dashed var(--gray-300);
            border-radius: var(--radius);
            padding: var(--space-5) var(--space-4);
            text-align: center;
            cursor: pointer;
            transition: background .2s, border-color .2s;
            color: var(--foreground-secondary);
            display: block;
        }
        .dropzone:hover, .dropzone.dragover { background: var(--background-subtle); border-color: var(--accent); }
        .dropzone .dz-icon { color: var(--foreground-tertiary); margin-bottom: var(--space-2); display: flex; justify-content: center; }
        .dropzone .dz-title { font-weight: 600; color: var(--foreground); font-size: 14px; }
        .dropzone .dz-hint { font-size: var(--text-sm); color: var(--foreground-tertiary); margin-top: 4px; }
        input[type="file"] { display: none; }

        .file-meta-card {
            display: none; align-items: center; gap: var(--space-3);
            margin-top: var(--space-3); padding: var(--space-2);
            border: 1px solid var(--gray-200); border-radius: var(--radius);
            background: var(--background);
        }
        .file-meta-card.show { display: flex; }
        .file-meta-card img {
            width: 48px; height: 48px; object-fit: cover;
            border: 1px solid var(--gray-200); border-radius: var(--radius-sm);
            background: var(--background-muted); flex-shrink: 0;
        }
        .file-meta-card .fm-info { min-width: 0; flex: 1; }
        .file-meta-card .fm-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-meta-card .fm-sub { font-size: var(--text-xs); color: var(--foreground-tertiary); font-family: var(--font-mono); margin-top: 2px; }

        /* 类型切换 Tab */
        .type-tabs { display: flex; border: 1px solid var(--gray-200); border-radius: var(--radius); overflow: hidden; margin-bottom: var(--space-3); }
        .type-tab {
            flex: 1; padding: 10px 8px; border: none; background: var(--background);
            color: var(--foreground-secondary); font-size: 14px; font-weight: 500;
            cursor: pointer; font-family: var(--font-sans); transition: background .2s, color .2s;
            border-right: 1px solid var(--gray-200);
        }
        .type-tab:last-child { border-right: none; }
        .type-tab.active { background: var(--foreground); color: var(--background); }
        .type-tab:hover:not(.active) { background: var(--background-subtle); }

        /* 滑块 */
        .slider-group { margin-bottom: var(--space-3); }
        .slider-group .slider-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-2); }
        .slider-group .slider-label { font-size: 14px; color: var(--foreground-secondary); font-weight: 500; }
        .slider-group .slider-value { font-size: var(--text-sm); color: var(--foreground); font-family: var(--font-mono); font-weight: 600; }
        input[type="range"] {
            -webkit-appearance: none; appearance: none;
            width: 100%; height: 4px; border-radius: 2px;
            background: var(--gray-200); outline: none; cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 16px; height: 16px; border-radius: 50%;
            background: var(--foreground); cursor: pointer; border: none;
            transition: transform .15s;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        input[type="range"]::-moz-range-thumb {
            width: 16px; height: 16px; border-radius: 50%;
            background: var(--foreground); cursor: pointer; border: none;
        }

        .input-group { margin-bottom: var(--space-3); }
        .input-group label { display: block; color: var(--foreground-secondary); margin-bottom: var(--space-2); font-weight: 500; font-size: 14px; }
        input[type="number"], select {
            width: 100%; padding: 10px 12px;
            border: 1px solid var(--gray-200); border-radius: var(--radius);
            font-size: 14px; font-family: var(--font-sans);
            color: var(--foreground); background: var(--background);
            transition: border-color .2s, box-shadow .2s;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-subtle); }
        input:disabled, select:disabled { opacity: .45; cursor: not-allowed; }
        select { cursor: pointer; }

        .color-row { display: flex; align-items: center; gap: var(--space-2); }
        .color-row input[type="color"] { width: 40px; height: 40px; border: 1px solid var(--gray-200); border-radius: var(--radius-sm); cursor: pointer; padding: 2px; background: var(--background); }
        .swatches { display: flex; gap: 6px; }
        .swatch { width: 28px; height: 28px; border-radius: var(--radius-sm); border: 1px solid var(--gray-200); cursor: pointer; }
        .swatch:hover { border-color: var(--gray-300); }

        .help-text { font-size: 13px; color: var(--foreground-tertiary); margin-top: 6px; line-height: 1.5; }

        .btn-row { display: flex; flex-wrap: wrap; gap: var(--space-2); }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 48px; padding: 0 22px;
            font-size: 16px; font-weight: 500; line-height: 1;
            border-radius: var(--radius-pill);
            border: 1px solid transparent;
            cursor: pointer; font-family: var(--font-sans);
            transition: background .2s, border-color .2s, color .2s;
        }
        .btn-primary { background: var(--foreground); color: var(--background); }
        .btn-primary:hover { background: var(--button-primary-hover); }
        .btn-ghost { background: var(--background); color: var(--foreground-secondary); border-color: var(--gray-200); }
        .btn-ghost:hover { background: var(--button-secondary-hover); }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-sm { height: 36px; padding: 0 14px; font-size: 14px; }
        .btn-sm.flex1 { flex: 1; }

        .format-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }

        /* 画布区 */
        .stage-card {
            background: var(--background);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            padding: var(--space-3);
        }
        .stage-bar {
            display: flex; justify-content: space-between; align-items: center;
            gap: var(--space-3); margin-bottom: var(--space-3); flex-wrap: wrap;
        }
        .stage-bar h2 { font-size: var(--text-md); font-weight: 600; letter-spacing: -0.01em; margin: 0; }
        .stage-info { font-size: var(--text-sm); color: var(--foreground-secondary); font-family: var(--font-mono); }
        .stage-info strong { color: var(--foreground); }

        .canvas-stage {
            position: relative;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            background-color: var(--background);
            background-image:
                linear-gradient(45deg, var(--background-muted) 25%, transparent 25%),
                linear-gradient(-45deg, var(--background-muted) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, var(--background-muted) 75%),
                linear-gradient(-45deg, transparent 75%, var(--background-muted) 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0;
            display: flex; align-items: center; justify-content: center;
            padding: var(--space-3);
            min-height: 320px;
        }
        #viewCanvas {
            display: block;
            max-width: 100%;
            max-height: 68vh;
            width: auto; height: auto;
            cursor: crosshair;
            touch-action: none;
            border-radius: var(--radius-sm);
        }
        #viewCanvas.hidden { display: none; }
        .stage-empty {
            color: var(--foreground-tertiary); text-align: center;
            padding: 60px 20px; font-size: 14px;
        }
        .stage-empty .se-icon { opacity: .6; margin-bottom: 12px; display: flex; justify-content: center; }
        .brush-cursor {
            position: fixed; z-index: 1050; pointer-events: none;
            border: 1px solid var(--foreground); border-radius: 50%;
            box-shadow: 0 0 0 1px var(--background) inset;
            display: none;
        }
        .brush-cursor.show { display: block; }

        .stage-footer {
            display: flex; justify-content: space-between; align-items: center;
            gap: var(--space-3); margin-top: var(--space-3); flex-wrap: wrap;
            font-size: var(--text-sm); color: var(--foreground-tertiary);
        }
        .stage-footer kbd {
            font-family: var(--font-mono); font-size: var(--text-xs);
            border: 1px solid var(--gray-200); border-bottom-width: 2px;
            border-radius: 4px; padding: 1px 5px; color: var(--foreground-secondary);
            background: var(--background-subtle);
        }

        /* Toast */
        .toast {
            position: fixed; left: 50%; bottom: 32px; z-index: 1200;
            transform: translateX(-50%) translateY(20px);
            opacity: 0; pointer-events: none;
            padding: 12px 20px; border-radius: var(--radius);
            border: 1px solid var(--gray-200);
            background: var(--foreground); color: var(--background);
            font-size: var(--text-base); font-weight: 500;
            box-shadow: 0 8px 24px rgba(0,0,0,0.10), 0 2px 6px rgba(0,0,0,0.06);
            transition: transform .25s, opacity .25s; max-width: 90%;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
        .toast.success, .toast.info { background: var(--foreground); color: var(--background); }
        .toast.error { background: var(--danger); color: #fff; border-color: var(--danger); }

        .theme-toggle {
            position: fixed; top: 16px; right: max(var(--space-4, 16px), calc((100% - var(--mt-shell)) / 2)); z-index: 1100;
            width: 40px; height: 40px; border-radius: var(--radius-full);
            border: 1px solid var(--gray-200); background: var(--background); color: var(--foreground);
            font-size: 18px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            transition: background .2s, border-color .2s, transform .2s;
        }
        .theme-toggle:hover { border-color: var(--gray-300); transform: scale(1.05); }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <script>
      (function () {
        try {
          var l = localStorage.getItem('lang');
          if (l === 'en') document.documentElement.lang = 'en';
          else if (l === 'zh') document.documentElement.lang = 'zh-CN';
          else if ((navigator.language || '').toLowerCase().indexOf('en') === 0) document.documentElement.lang = 'en';
        } catch (e) {}
      })();
    </script>
</head>
<body>
    <div class="container">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换深色 / 浅色模式" title="切换主题">
            <span class="theme-toggle-icon">🌙</span>
        </button>

        <div class="header">
            <h1>图片涂抹打码</h1>
            <p class="subtitle">鼠标涂抹局部马赛克 / 模糊 / 纯色遮挡，笔刷与颗粒可调，支持撤销重做与导出，本地处理不上传</p>
        </div>

        <div class="layout">
            <!-- 左侧：上传与设置 -->
            <div class="card">
                <h2>① 添加图片</h2>
                <label class="dropzone" id="dropzone" for="fileInput">
                    <div class="dz-icon" aria-hidden="true">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <path d="M21 15l-5-5L5 21"/>
                        </svg>
                    </div>
                    <div class="dz-title">点击选择 或 拖拽图片到此</div>
                    <div class="dz-hint">支持 JPG / PNG / WebP，也可直接 Ctrl+V 粘贴</div>
                </label>
                <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.webp,image/*">

                <div class="file-meta-card" id="fileMetaCard">
                    <img id="fileThumb" src="" alt="">
                    <div class="fm-info">
                        <div class="fm-name" id="fileName"></div>
                        <div class="fm-sub" id="fileSub"></div>
                    </div>
                </div>

                <h2>② 涂抹方式</h2>
                <div class="type-tabs">
                    <button class="type-tab active" id="tabMosaic" onclick="switchMode('mosaic')">马赛克</button>
                    <button class="type-tab" id="tabBlur" onclick="switchMode('blur')">模糊</button>
                    <button class="type-tab" id="tabSolid" onclick="switchMode('solid')">纯色</button>
                </div>

                <div class="slider-group">
                    <div class="slider-header">
                        <span class="slider-label">画笔大小</span>
                        <span class="slider-value" id="brushVal">60 px</span>
                    </div>
                    <input type="range" id="brushSlider" min="5" max="400" value="60" step="1">
                </div>

                <div class="slider-group" id="blockGroup">
                    <div class="slider-header">
                        <span class="slider-label">马赛克颗粒</span>
                        <span class="slider-value" id="blockVal">12 px</span>
                    </div>
                    <input type="range" id="blockSlider" min="4" max="60" value="12" step="1">
                </div>

                <div class="slider-group" id="blurGroup" style="display:none;">
                    <div class="slider-header">
                        <span class="slider-label">模糊强度</span>
                        <span class="slider-value" id="blurVal">20</span>
                    </div>
                    <input type="range" id="blurSlider" min="4" max="80" value="20" step="1">
                </div>

                <div class="input-group" id="colorGroup" style="display:none;">
                    <label>遮挡颜色</label>
                    <div class="color-row">
                        <input type="color" id="colorInput" value="#000000">
                        <div class="swatches">
                            <button class="swatch" style="background:#000000" onclick="setColor('#000000')" title="黑"></button>
                            <button class="swatch" style="background:#ffffff" onclick="setColor('#ffffff')" title="白"></button>
                            <button class="swatch" style="background:#808080" onclick="setColor('#808080')" title="灰"></button>
                        </div>
                    </div>
                    <div class="help-text">纯色遮挡为不可逆覆盖，适合直接盖住敏感信息。</div>
                </div>

                <h2>③ 操作</h2>
                <div class="btn-row">
                    <button class="btn btn-ghost btn-sm flex1" id="undoBtn" onclick="doUndo()">撤销</button>
                    <button class="btn btn-ghost btn-sm flex1" id="redoBtn" onclick="doRedo()">重做</button>
                    <button class="btn btn-ghost btn-sm flex1" id="resetBtn" onclick="resetWork()">全部还原</button>
                </div>
                <div class="btn-row" style="margin-top:8px;">
                    <button class="btn btn-ghost btn-sm flex1" id="compareBtn">按住看原图</button>
                </div>

                <h2>④ 导出</h2>
                <div class="format-row">
                    <div class="input-group" style="margin:0;">
                        <label for="fmtSelect">输出格式</label>
                        <select id="fmtSelect">
                            <option value="image/png" selected>PNG（无损）</option>
                            <option value="image/jpeg">JPEG</option>
                            <option value="image/webp">WebP</option>
                        </select>
                    </div>
                    <div class="input-group" style="margin:0;">
                        <label for="qualityInput">质量</label>
                        <input type="number" id="qualityInput" value="0.92" min="0.1" max="1" step="0.01" disabled>
                    </div>
                </div>
                <div class="help-text">导出分辨率与原图完全一致，不受预览缩放影响。</div>
                <div class="btn-row" style="margin-top:var(--space-3);">
                    <button class="btn btn-primary" id="downloadBtn" onclick="downloadResult()" style="flex:1;" disabled>下载图片</button>
                </div>
            </div>

            <!-- 右侧：画布 -->
            <div class="stage-card">
                <div class="stage-bar">
                    <h2>涂抹区域</h2>
                    <div class="stage-info" id="stageInfo">未加载图片</div>
                </div>

                <div class="canvas-stage" id="canvasStage">
                    <div class="stage-empty" id="stageEmpty">
                        <div class="se-icon" aria-hidden="true">
                            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <path d="M8 8h.01M12 8h.01M16 8h.01M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/>
                            </svg>
                        </div>
                        添加图片后，在画面上按住鼠标拖动即可涂抹打码
                    </div>
                    <canvas id="viewCanvas" class="hidden"></canvas>
                </div>

                <div class="stage-footer">
                    <span id="coverInfo">提示：涂抹时可用 <kbd>[</kbd> <kbd>]</kbd> 调整笔刷，<kbd>Ctrl</kbd>+<kbd>Z</kbd> 撤销</span>
                    <span id="outInfo"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="brush-cursor" id="brushCursor"></div>
    <div class="toast" id="toast"></div>

    <script>
        var MAX_UNDO = 40;

        var state = {
            img: null,
            fileName: '',
            fileSize: 0,
            origW: 0,
            origH: 0,
            thumbUrl: '',
            srcCanvas: null, srcCtx: null,     // 原图层（只读，采样源）
            workCanvas: null, workCtx: null,   // 工作层（涂抹结果）
            viewCanvas: null, viewCtx: null,   // 预览层
            processed: {},                     // "key" -> true，避免重复处理同一块
            coveredArea: 0,                    // 已覆盖像素面积（估算）
            undoStack: [],
            redoStack: [],
            drawing: false,
            comparing: false,
            last: null,
            pending: null,
            stroke: null,
            raf: 0,
            mode: 'mosaic'
        };

        /* ========== 工具函数 ========== */
        function $(id) { return document.getElementById(id); }
        function showToast(msg, type) {
            var t = $('toast');
            t.textContent = msg;
            t.className = 'toast show ' + (type || 'info');
            setTimeout(function () { t.className = 'toast'; }, 2600);
        }
        function formatSize(b) {
            if (b < 1024) return b + ' B';
            if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
            return (b / 1024 / 1024).toFixed(2) + ' MB';
        }
        function baseName(name) { return name.replace(/\.[^.]+$/, '') || 'image'; }
        function extForType(type) {
            if (type === 'image/jpeg') return 'jpg';
            if (type === 'image/webp') return 'webp';
            return 'png';
        }
        function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

        /* ========== 参数 ========== */
        function getMode() { return state.mode; }
        function getBrush() { return parseFloat($('brushSlider').value); }
        function getBlock() { return parseFloat($('blockSlider').value); }
        function getBlur() { return parseFloat($('blurSlider').value); }
        function getColor() { return $('colorInput').value; }
        function outType() { return $('fmtSelect').value; }
        function outQuality() {
            var q = parseFloat($('qualityInput').value);
            if (isNaN(q) || q <= 0 || q > 1) q = 0.92;
            return q;
        }
        function currentParam() {
            return { r: getBrush(), bs: getBlock(), blur: getBlur(), color: getColor() };
        }
        function paramKey(mode, p) {
            if (mode === 'mosaic') return 'mosaic_' + p.bs;
            if (mode === 'blur') return 'blur_' + p.blur;
            return 'solid_' + p.color;
        }
        function gridSizeFor(mode, p) {
            if (mode === 'mosaic') return Math.max(2, Math.round(p.bs));
            if (mode === 'solid') return 8;
            return Math.max(8, Math.round(p.blur));
        }

        /* ========== 模式切换 ========== */
        function switchMode(mode) {
            state.mode = mode;
            $('tabMosaic').classList.toggle('active', mode === 'mosaic');
            $('tabBlur').classList.toggle('active', mode === 'blur');
            $('tabSolid').classList.toggle('active', mode === 'solid');
            $('blockGroup').style.display = mode === 'mosaic' ? '' : 'none';
            $('blurGroup').style.display = mode === 'blur' ? '' : 'none';
            $('colorGroup').style.display = mode === 'solid' ? '' : 'none';
        }
        function setColor(c) {
            $('colorInput').value = c;
        }

        /* ========== 图片加载 ========== */
        function handleFile(file) {
            if (!file) return;
            if (!file.type || !file.type.startsWith('image/')) { showToast('请选择图片文件', 'error'); return; }
            var url = URL.createObjectURL(file);
            var im = new Image();
            im.onload = function () {
                if (state.thumbUrl && state.thumbUrl.indexOf('blob:') === 0) URL.revokeObjectURL(state.thumbUrl);
                state.img = im;
                state.fileName = file.name;
                state.fileSize = file.size;
                state.origW = im.naturalWidth;
                state.origH = im.naturalHeight;
                state.thumbUrl = url;
                setupCanvases();
                $('fileThumb').src = url;
                $('fileName').textContent = file.name;
                $('fileSub').textContent = formatSize(file.size) + ' · ' + state.origW + '×' + state.origH;
                $('fileMetaCard').classList.add('show');
                // 依据图片尺寸给出合理的默认笔刷与颗粒
                $('brushSlider').max = String(clamp(Math.round(state.origW / 3), 100, 800));
                $('brushSlider').value = String(clamp(Math.round(state.origW / 25), 10, 120));
                $('blockSlider').value = String(clamp(Math.round(state.origW / 200), 6, 24));
                syncSliderLabels();
                showToast('图片已加载，可开始涂抹', 'success');
                updateUI();
            };
            im.onerror = function () { showToast('图片解码失败', 'error'); };
            im.src = url;
        }

        function setupCanvases() {
            var W = state.origW, H = state.origH;
            state.srcCanvas = document.createElement('canvas');
            state.srcCanvas.width = W; state.srcCanvas.height = H;
            state.srcCtx = state.srcCanvas.getContext('2d');
            state.srcCtx.drawImage(state.img, 0, 0, W, H);

            state.workCanvas = document.createElement('canvas');
            state.workCanvas.width = W; state.workCanvas.height = H;
            state.workCtx = state.workCanvas.getContext('2d', { willReadFrequently: true });

            resetWork(false);

            var view = $('viewCanvas');
            var maxW = 1000;
            var vw = Math.min(W, maxW);
            var vh = Math.round(vw * H / W);
            view.width = vw; view.height = vh;
            state.viewCanvas = view;
            state.viewCtx = view.getContext('2d');
            view.classList.remove('hidden');
            $('stageEmpty').style.display = 'none';
            renderView();
        }

        /* ========== 渲染 ========== */
        function renderView() {
            if (!state.workCanvas || !state.viewCanvas) return;
            var v = state.viewCanvas;
            state.viewCtx.clearRect(0, 0, v.width, v.height);
            state.viewCtx.drawImage(state.workCanvas, 0, 0, v.width, v.height);
        }
        function showOriginal(on) {
            if (!state.viewCanvas || !state.srcCanvas) return;
            var v = state.viewCanvas;
            state.viewCtx.clearRect(0, 0, v.width, v.height);
            state.viewCtx.drawImage(on ? state.srcCanvas : state.workCanvas, 0, 0, v.width, v.height);
        }

        function resetWork(notify) {
            if (!state.workCanvas) return;
            state.workCtx.clearRect(0, 0, state.origW, state.origH);
            state.workCtx.drawImage(state.srcCanvas, 0, 0);
            state.processed = {};
            state.coveredArea = 0;
            state.undoStack = [];
            state.redoStack = [];
            renderView();
            updateUI();
            if (notify !== false) showToast('已还原为原图');
        }

        /* ========== 坐标换算 ========== */
        function toImg(e) {
            var rect = state.viewCanvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) / rect.width * state.origW,
                y: (e.clientY - rect.top) / rect.height * state.origH
            };
        }

        /* ========== 涂抹核心 ========== */
        function copySub(src, sw, x, y, w, h) {
            var d = new Uint8ClampedArray(w * h * 4);
            for (var row = 0; row < h; row++) {
                var s = ((y + row) * sw + x) * 4;
                d.set(src.subarray(s, s + w * 4), row * w * 4);
            }
            return d;
        }
        function putSub(dst, dw, x, y, w, h, sub) {
            for (var row = 0; row < h; row++) {
                var o = ((y + row) * dw + x) * 4;
                dst.set(sub.subarray(row * w * 4, (row + 1) * w * 4), o);
            }
        }

        // 计算包围盒内的效果像素（基于原图采样，保证幂等）
        function buildEffect(mode, p, x0, y0, bw, bh) {
            var W = state.origW, H = state.origH;
            if (mode === 'mosaic') {
                var src = state.srcCtx.getImageData(x0, y0, bw, bh).data;
                var out = new Uint8ClampedArray(bw * bh * 4);
                var bs = Math.max(2, Math.round(p.bs));
                var gb = Math.floor(x0 / bs), ge = Math.ceil((x0 + bw) / bs);
                var vb = Math.floor(y0 / bs), ve = Math.ceil((y0 + bh) / bs);
                for (var by = vb; by < ve; by++) {
                    for (var bx = gb; bx < ge; bx++) {
                        var px = bx * bs, py = by * bs;
                        var rx = clamp(px, x0, x0 + bw), ry = clamp(py, y0, y0 + bh);
                        var rx2 = clamp(px + bs, x0, x0 + bw), ry2 = clamp(py + bs, y0, y0 + bh);
                        var cw = rx2 - rx, ch = ry2 - ry;
                        if (cw <= 0 || ch <= 0) continue;
                        var r = 0, g = 0, b = 0, a = 0, n = 0;
                        for (var yy = ry; yy < ry2; yy++) {
                            var base = ((yy - y0) * bw + (rx - x0)) * 4;
                            for (var xx = 0; xx < cw; xx++) {
                                var i = base + xx * 4;
                                r += src[i]; g += src[i + 1]; b += src[i + 2]; a += src[i + 3]; n++;
                            }
                        }
                        r = Math.round(r / n); g = Math.round(g / n); b = Math.round(b / n); a = Math.round(a / n);
                        for (var y2 = ry; y2 < ry2; y2++) {
                            var rowBase = (y2 - y0) * bw;
                            for (var x2 = rx; x2 < rx2; x2++) {
                                var o = (rowBase + (x2 - x0)) * 4;
                                out[o] = r; out[o + 1] = g; out[o + 2] = b; out[o + 3] = a;
                            }
                        }
                    }
                }
                return out;
            }
            if (mode === 'blur') {
                var k = Math.max(2, Math.round(p.blur / 2));
                var sw = Math.max(1, Math.ceil(bw / k)), sh = Math.max(1, Math.ceil(bh / k));
                var tmpA = document.createElement('canvas');
                tmpA.width = sw; tmpA.height = sh;
                var ca = tmpA.getContext('2d');
                ca.imageSmoothingEnabled = true; ca.imageSmoothingQuality = 'high';
                ca.drawImage(state.srcCanvas, x0, y0, bw, bh, 0, 0, sw, sh);
                var tmpB = document.createElement('canvas');
                tmpB.width = bw; tmpB.height = bh;
                var cb = tmpB.getContext('2d');
                cb.imageSmoothingEnabled = true; cb.imageSmoothingQuality = 'high';
                cb.drawImage(tmpA, 0, 0, sw, sh, 0, 0, bw, bh);
                return cb.getImageData(0, 0, bw, bh).data;
            }
            // solid
            var hex = p.color || '#000000';
            var rr = parseInt(hex.slice(1, 3), 16) || 0;
            var gg = parseInt(hex.slice(3, 5), 16) || 0;
            var bb = parseInt(hex.slice(5, 7), 16) || 0;
            var out2 = new Uint8ClampedArray(bw * bh * 4);
            for (var i2 = 0; i2 < bw * bh; i2++) {
                out2[i2 * 4] = rr; out2[i2 * 4 + 1] = gg; out2[i2 * 4 + 2] = bb; out2[i2 * 4 + 3] = 255;
            }
            return out2;
        }

        function stamp(cx, cy, stroke) {
            var W = state.origW, H = state.origH;
            var mode = stroke.mode, p = stroke.param;
            var r = p.r;
            var g = gridSizeFor(mode, p);

            var x0 = Math.floor((cx - r) / g) * g;
            var y0 = Math.floor((cy - r) / g) * g;
            var x1 = Math.ceil((cx + r) / g) * g;
            var y1 = Math.ceil((cy + r) / g) * g;
            x0 = clamp(x0, 0, W); y0 = clamp(y0, 0, H);
            x1 = clamp(x1, 0, W); y1 = clamp(y1, 0, H);
            var bw = x1 - x0, bh = y1 - y0;
            if (bw <= 0 || bh <= 0) return;

            var before = state.workCtx.getImageData(x0, y0, bw, bh);
            var out = state.workCtx.createImageData(bw, bh);
            out.data.set(before.data);

            var eff = buildEffect(mode, p, x0, y0, bw, bh);
            var pk = paramKey(mode, p);
            var r2 = r * r;
            var gb = Math.floor(x0 / g), ge = Math.ceil(x1 / g);
            var vb = Math.floor(y0 / g), ve = Math.ceil(y1 / g);

            for (var by = vb; by < ve; by++) {
                for (var bx = gb; bx < ge; bx++) {
                    var px = bx * g + g / 2, py = by * g + g / 2;
                    var dx = px - cx, dy = py - cy;
                    if (dx * dx + dy * dy > r2) continue;

                    var rx = clamp(bx * g, x0, x1), ry = clamp(by * g, y0, y1);
                    var rx2 = clamp(bx * g + g, x0, x1), ry2 = clamp(by * g + g, y0, y1);
                    var cw = rx2 - rx, ch = ry2 - ry;
                    if (cw <= 0 || ch <= 0) continue;

                    var key = pk + '_' + bx + '_' + by;
                    if (state.processed[key]) continue;

                    // 记录撤销所需的前像
                    if (stroke.changes.length < 4000) {
                        stroke.changes.push({
                            key: key,
                            x: rx, y: ry, w: cw, h: ch,
                            data: copySub(before.data, bw, rx - x0, ry - y0, cw, ch)
                        });
                    }
                    state.processed[key] = true;
                    state.coveredArea += cw * ch;

                    // 写入效果像素
                    for (var yy = ry; yy < ry2; yy++) {
                        var sRow = (yy - y0) * bw, dRow = (yy - y0) * bw;
                        var sOff = (sRow + (rx - x0)) * 4, dOff = (dRow + (rx - x0)) * 4;
                        out.data.set(eff.subarray(sOff, sOff + cw * 4), dOff);
                    }
                }
            }

            state.workCtx.putImageData(out, x0, y0);
        }

        function paintLine(a, b, stroke) {
            var dx = b.x - a.x, dy = b.y - a.y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            var step = Math.max(1, stroke.param.r * 0.3);
            var n = Math.max(1, Math.ceil(dist / step));
            for (var i = 1; i <= n; i++) {
                var t = i / n;
                stamp(a.x + dx * t, a.y + dy * t, stroke);
                stroke.points.push({ x: a.x + dx * t, y: a.y + dy * t });
            }
        }

        /* ========== 撤销 / 重做 ========== */
        function doUndo() {
            var st = state.undoStack.pop();
            if (!st || !st.changes.length) { showToast('没有可撤销的操作'); return; }
            var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
            st.changes.forEach(function (c) {
                if (c.x < x0) x0 = c.x;
                if (c.y < y0) y0 = c.y;
                if (c.x + c.w > x1) x1 = c.x + c.w;
                if (c.y + c.h > y1) y1 = c.y + c.h;
            });
            var bw = x1 - x0, bh = y1 - y0;
            var cur = state.workCtx.getImageData(x0, y0, bw, bh);
            st.changes.forEach(function (c) {
                putSub(cur.data, bw, c.x - x0, c.y - y0, c.w, c.h, c.data);
                delete state.processed[c.key];
                state.coveredArea = Math.max(0, state.coveredArea - c.w * c.h);
            });
            state.workCtx.putImageData(cur, x0, y0);
            state.redoStack.push(st);
            renderView();
            updateUI();
        }

        function doRedo() {
            var st = state.redoStack.pop();
            if (!st) { showToast('没有可重做的操作'); return; }
            var s = { mode: st.mode, param: st.param, points: [], changes: [] };
            var prev = st.points[0];
            stamp(prev.x, prev.y, s);
            for (var i = 1; i < st.points.length; i++) {
                paintLine(prev, st.points[i], s);
                prev = st.points[i];
            }
            state.undoStack.push(s);
            renderView();
            updateUI();
        }

        /* ========== 指针交互 ========== */
        function flush() {
            state.raf = 0;
            if (!state.drawing || !state.pending || !state.stroke) return;
            paintLine(state.last, state.pending, state.stroke);
            state.last = state.pending;
            state.pending = null;
            renderView();
        }

        function startStroke(e) {
            if (!state.img) return;
            e.preventDefault();
            var p = toImg(e);
            state.drawing = true;
            state.last = p;
            state.pending = null;
            state.stroke = { mode: getMode(), param: currentParam(), points: [p], changes: [] };
            try { state.viewCanvas.setPointerCapture(e.pointerId); } catch (err) {}
            stamp(p.x, p.y, state.stroke);
            renderView();
        }

        function moveStroke(e) {
            updateCursor(e);
            if (!state.drawing) return;
            state.pending = toImg(e);
            if (!state.raf) state.raf = requestAnimationFrame(flush);
        }

        function endStroke() {
            if (state.comparing) {
                state.comparing = false;
                if (state.img) showOriginal(false);
            }
            if (!state.drawing) return;
            if (state.raf) { cancelAnimationFrame(state.raf); state.raf = 0; }
            if (state.pending && state.stroke) {
                paintLine(state.last, state.pending, state.stroke);
                state.last = state.pending;
                state.pending = null;
            }
            state.drawing = false;
            if (state.stroke && state.stroke.changes.length) {
                state.undoStack.push(state.stroke);
                if (state.undoStack.length > MAX_UNDO) state.undoStack.shift();
                state.redoStack.length = 0;
            }
            state.stroke = null;
            renderView();
            updateUI();
        }

        function updateCursor(e) {
            var cur = $('brushCursor');
            if (!state.img) { cur.classList.remove('show'); return; }
            var rect = state.viewCanvas.getBoundingClientRect();
            var scale = rect.width / state.origW;
            var d = Math.max(4, getBrush() * scale * 2);
            cur.style.width = d + 'px';
            cur.style.height = d + 'px';
            cur.style.left = e.clientX + 'px';
            cur.style.top = e.clientY + 'px';
            cur.style.transform = 'translate(-50%, -50%)';
            cur.classList.add('show');
        }

        /* ========== 导出 ========== */
        function downloadResult() {
            if (!state.workCanvas) return;
            var type = outType();
            var cv = state.workCanvas;
            if (type !== 'image/png') {
                cv = document.createElement('canvas');
                cv.width = state.origW; cv.height = state.origH;
                var c = cv.getContext('2d');
                c.fillStyle = '#ffffff';
                c.fillRect(0, 0, cv.width, cv.height);
                c.drawImage(state.workCanvas, 0, 0);
            }
            cv.toBlob(function (blob) {
                if (!blob) { showToast('导出失败', 'error'); return; }
                var a = document.createElement('a');
                a.download = baseName(state.fileName) + '_mosaic.' + extForType(type);
                a.href = URL.createObjectURL(blob);
                a.click();
                setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
                showToast('已导出 ' + formatSize(blob.size), 'success');
            }, type, type === 'image/png' ? undefined : outQuality());
        }

        /* ========== UI 同步 ========== */
        function syncSliderLabels() {
            $('brushVal').textContent = $('brushSlider').value + ' px';
            $('blockVal').textContent = $('blockSlider').value + ' px';
            $('blurVal').textContent = $('blurSlider').value;
        }
        function updateUI() {
            var has = !!state.img;
            $('undoBtn').disabled = !state.undoStack.length;
            $('redoBtn').disabled = !state.redoStack.length;
            $('resetBtn').disabled = !has || !state.undoStack.length;
            $('downloadBtn').disabled = !has;
            if (!has) { $('stageInfo').textContent = '未加载图片'; $('outInfo').textContent = ''; return; }
            var pct = state.origW * state.origH ? (state.coveredArea / (state.origW * state.origH) * 100) : 0;
            $('stageInfo').innerHTML = state.origW + '×' + state.origH +
                ' · 已打码 <strong>' + Math.min(100, pct).toFixed(1) + '%</strong>' +
                ' · 可撤销 <strong>' + state.undoStack.length + '</strong> 步';
            $('outInfo').textContent = '导出：' + state.origW + '×' + state.origH + ' ' + extForType(outType()).toUpperCase();
        }

        /* ========== 事件绑定 ========== */
        var dz = $('dropzone');
        $('fileInput').addEventListener('change', function (e) {
            if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
            e.target.value = '';
        });
        ['dragenter', 'dragover'].forEach(function (ev) {
            dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add('dragover'); });
        });
        ['dragleave', 'drop'].forEach(function (ev) {
            dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove('dragover'); });
        });
        dz.addEventListener('drop', function (e) {
            var f = e.dataTransfer.files && e.dataTransfer.files[0];
            if (f) handleFile(f);
        });

        // 粘贴图片
        document.addEventListener('paste', function (e) {
            var items = e.clipboardData && e.clipboardData.items;
            if (!items) return;
            for (var i = 0; i < items.length; i++) {
                if (items[i].type && items[i].type.indexOf('image/') === 0) {
                    var f = items[i].getAsFile();
                    if (f) { handleFile(f); e.preventDefault(); }
                    return;
                }
            }
        });

        // 画布涂抹
        var view = $('viewCanvas');
        view.addEventListener('pointerdown', startStroke);
        view.addEventListener('pointermove', moveStroke);
        window.addEventListener('pointerup', endStroke);
        view.addEventListener('pointerenter', function (e) { if (state.img) updateCursor(e); });
        view.addEventListener('pointerleave', function () { $('brushCursor').classList.remove('show'); });

        // 滑块
        ['brushSlider', 'blockSlider', 'blurSlider'].forEach(function (id) {
            $(id).addEventListener('input', syncSliderLabels);
        });
        $('fmtSelect').addEventListener('change', function () {
            $('qualityInput').disabled = this.value === 'image/png';
            updateUI();
        });

        // 按住看原图
        $('compareBtn').addEventListener('pointerdown', function () {
            if (!state.img || state.drawing) return;
            state.comparing = true;
            showOriginal(true);
        });

        // 快捷键
        document.addEventListener('keydown', function (e) {
            var tag = (e.target.tagName || '').toLowerCase();
            if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                if (e.shiftKey) doRedo(); else doUndo();
                return;
            }
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'y') {
                e.preventDefault(); doRedo(); return;
            }
            if (e.key === '[' || e.key === ']') {
                var s = $('brushSlider');
                var step = Math.max(1, Math.round(parseFloat(s.max) / 50));
                s.value = String(clamp(parseFloat(s.value) + (e.key === ']' ? step : -step), parseFloat(s.min), parseFloat(s.max)));
                syncSliderLabels();
                e.preventDefault();
            }
        });

        switchMode('mosaic');
        syncSliderLabels();
        updateUI();
    </script>

    <script>
      (function () {
        var btn = document.getElementById('themeToggle');
        if (!btn) return;
        function syncIcon() {
          var isDark = document.documentElement.classList.contains('dark');
          btn.querySelector('.theme-toggle-icon').textContent = isDark ? '☀️' : '🌙';
          btn.title = isDark ? '切换到浅色' : '切换到深色';
        }
        function applyTheme(t) {
          if (t === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
          try { localStorage.setItem('theme', t); } catch (e) {}
          syncIcon();
          if (typeof window.__onThemeChange === 'function') window.__onThemeChange(t);
        }
        btn.addEventListener('click', function () {
          applyTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
        });
        syncIcon();
      })();
    </script>

    <script>
      /* ========== 中英切换 ==========
         机制：页面里保留中文原文，MAP 是「中文 → 英文」的对照表。
         切换时遍历文本节点与 placeholder / title / aria-label 做替换，
         首次替换前把原文存到节点上，切回中文时还原（不会翻译两次）。
         JS 动态插入的提示、选项、Toast 由 MutationObserver 补翻。
      */
      (function () {
        var KEY = 'lang';
        var MAP = {
          "图片涂抹打码": "Image Blur",
          "鼠标涂抹局部马赛克 / 模糊 / 纯色遮挡，笔刷与颗粒可调，支持撤销重做与导出，本地处理不上传": "Brush mosaic, blur or solid color over any area, with adjustable brush and grain, undo / redo and export — all local, nothing uploaded",
          "① 添加图片": "① Add Image",
          "点击选择 或 拖拽图片到此": "Click to choose, or drag an image here",
          "支持 JPG / PNG / WebP，也可直接 Ctrl+V 粘贴": "JPG / PNG / WebP — or just paste with Ctrl+V",
          "② 涂抹方式": "② Mask Style",
          "马赛克": "Mosaic",
          "模糊": "Blur",
          "纯色": "Solid",
          "画笔大小": "Brush size",
          "马赛克颗粒": "Mosaic grain",
          "模糊强度": "Blur strength",
          "遮挡颜色": "Fill color",
          "黑": "Black",
          "白": "White",
          "灰": "Gray",
          "纯色遮挡为不可逆覆盖，适合直接盖住敏感信息。": "Solid fill is permanent — ideal for covering sensitive details.",
          "③ 操作": "③ Actions",
          "撤销": "Undo",
          "重做": "Redo",
          "全部还原": "Reset all",
          "按住看原图": "Hold to see original",
          "④ 导出": "④ Export",
          "输出格式": "Output format",
          "PNG（无损）": "PNG (lossless)",
          "质量": "Quality",
          "导出分辨率与原图完全一致，不受预览缩放影响。": "Exports at the full original resolution, unaffected by preview scaling.",
          "下载图片": "Download image",
          "涂抹区域": "Canvas",
          "未加载图片": "No image loaded",
          "添加图片后，在画面上按住鼠标拖动即可涂抹打码": "Add an image, then hold and drag over any area to mask it",
          "提示：涂抹时可用": "Tip: press",
          "调整笔刷，": "to resize the brush, ",
          "请选择图片文件": "Please choose an image file",
          "图片已加载，可开始涂抹": "Image loaded, ready to mask",
          "图片解码失败": "Could not decode this image",
          "已还原为原图": "Reverted to the original",
          "没有可撤销的操作": "Nothing to undo",
          "没有可重做的操作": "Nothing to redo",
          "导出失败": "Export failed",
          "切换深色 / 浅色模式": "Toggle dark / light mode",
          "切换主题": "Switch theme",
          "切换到浅色": "Switch to light",
          "切换到深色": "Switch to dark"
        };
        var PAIRS = [
          ["导出：", "Export: "],
          ["已导出", "Exported"],
          ["已打码", "masked"],
          ["· 可撤销", "·"],
          ["步", "undo steps"]
        ];

        var CJK = /[\u4e00-\u9fff\uff00-\uffef]/;
        var busy = false;
        var mo = null;
        var MO_OPT = { childList: true, subtree: true, characterData: true };
        function pause(fn) {
          if (busy) return;
          busy = true;
          try {
            if (mo) mo.disconnect();
            fn();
          } finally {
            if (mo) { try { mo.observe(document.body, MO_OPT); } catch (e) {} }
            busy = false;
          }
        }

        function detect() {
          try {
            var v = localStorage.getItem(KEY);
            if (v === 'zh' || v === 'en') return v;
          } catch (e) {}
          return (navigator.language || '').toLowerCase().indexOf('en') === 0 ? 'en' : 'zh';
        }
        var lang = detect();

        function tr(s) {
          s = String(s);
          var t = s.trim();
          if (MAP[t] != null) return s.replace(t, MAP[t]);
          var out = s;
          for (var i = 0; i < PAIRS.length; i++) {
            if (out.indexOf(PAIRS[i][0]) >= 0) out = out.split(PAIRS[i][0]).join(PAIRS[i][1]);
          }
          return out;
        }

        function applyText(node) {
          if (!node || node.nodeType !== 3) return;
          var v = node.nodeValue;
          if (!v) return;
          if (node.__mt_orig == null) {
            if (!CJK.test(v)) return;
            node.__mt_orig = v;
          }
          var nv = lang === 'en' ? tr(node.__mt_orig) : node.__mt_orig;
          if (nv !== v) node.nodeValue = nv;
        }

        function applyAttrs(el) {
          if (!el || el.nodeType !== 1) return;
          ['placeholder', 'title', 'aria-label'].forEach(function (a) {
            if (!el.hasAttribute(a)) return;
            var v = el.getAttribute(a);
            if (!v) return;
            var k = '__mt_' + a;
            if (el[k] == null) {
              if (!CJK.test(v)) return;
              el[k] = v;
            }
            var nv = lang === 'en' ? tr(el[k]) : el[k];
            if (nv !== v) el.setAttribute(a, nv);
          });
        }

        function walk(root) {
          var tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
          var list = [], n;
          while ((n = tw.nextNode())) list.push(n);
          list.forEach(applyText);
          var els = [];
          if (root.nodeType === 1) {
            els.push(root);
            els = els.concat(Array.prototype.slice.call(root.querySelectorAll('*')));
          }
          els.forEach(applyAttrs);
        }

        function refresh() {
          pause(function () { walk(document.body); });
        }

        window.mtT = function (s) { return lang === 'en' ? tr(s) : s; };

        if (window.MutationObserver) {
          mo = new MutationObserver(function (muts) {
            pause(function () {
              muts.forEach(function (m) {
                if (m.type === 'childList') {
                  for (var i = 0; i < m.addedNodes.length; i++) {
                    var a = m.addedNodes[i];
                    if (a.nodeType === 3) applyText(a);
                    else if (a.nodeType === 1) walk(a);
                  }
                } else if (m.type === 'characterData') applyText(m.target);
              });
            });
          });
          mo.observe(document.body, MO_OPT);
        }

        function mountStyle() {
          if (document.getElementById('mt-lang-style')) return;
          var st = document.createElement('style');
          st.id = 'mt-lang-style';
          st.textContent =
            '.mt-lang{position:fixed;top:16px;right:calc(max(var(--space-4, 16px), calc((100% - var(--mt-shell)) / 2)) + 48px);z-index:1100;height:40px;min-width:46px;' +
            'padding:0 12px;border-radius:999px;border:1px solid var(--gray-200,#eaeaea);' +
            'background:var(--background,#fff);color:var(--foreground,#171717);font-family:inherit;' +
            'font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;' +
            'justify-content:center;transition:background .2s,border-color .2s,transform .2s;}' +
            '.mt-lang:hover{border-color:var(--gray-300,#d4d4d4);transform:scale(1.05);}' +
            '.mt-lang.inline{position:static;height:36px;margin-left:auto;margin-right:8px;}' +
            '@media (hover: none){.mt-lang:hover{transform:none;}}';
          document.head.appendChild(st);
        }

        function syncDoc() {
          document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
          var b = document.getElementById('langToggle');
          if (b) {
            b.textContent = lang === 'en' ? '中' : 'EN';
            var t = lang === 'en' ? 'Switch to Chinese' : 'Switch to English';
            b.setAttribute('title', t);
            b.setAttribute('aria-label', t);
          }
          if (document.__mt_title == null) document.__mt_title = document.title;
          document.title = lang === 'en' ? tr(document.__mt_title) : document.__mt_title;
        }

        function mount() {
          mountStyle();
          var tt = document.getElementById('themeToggle');
          if (!tt || document.getElementById('langToggle')) return;
          var btn = document.createElement('button');
          var inline = window.getComputedStyle(tt).position !== 'fixed';
          btn.className = 'mt-lang' + (inline ? ' inline' : '');
          btn.id = 'langToggle';
          btn.type = 'button';
          btn.addEventListener('click', function () {
            lang = lang === 'en' ? 'zh' : 'en';
            try { localStorage.setItem(KEY, lang); } catch (e) {}
            refresh();
            syncDoc();
          });
          tt.parentNode.insertBefore(btn, tt);
        }

        mount();
        refresh();
        syncDoc();
        window.addEventListener('load', function () { refresh(); syncDoc(); });
      })();
    </script>
</body>
