        /* 暗色模式 token：由 <html class="dark"> 驱动，JS 根据系统偏好或手动切换设置 */

        .status-bar {
            display: flex; align-items: center; gap: 10px;
            padding: 12px var(--space-3); border-radius: var(--radius); margin-bottom: var(--space-3);
            font-size: 14px; font-weight: 500;
        }
        .status-valid { background: var(--accent-subtle); color: var(--accent); border: 1px solid var(--accent); }
        .status-invalid { background: var(--danger-subtle); color: var(--danger); border: 1px solid var(--danger); }
        .status-idle { background: var(--background-subtle); color: var(--foreground-tertiary); border: 1px solid var(--gray-200); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .status-valid .status-dot { background: var(--accent); }
        .status-invalid .status-dot { background: var(--danger); }
        .status-idle .status-dot { background: var(--gray-700); }

        .meta { display: flex; gap: 18px; flex-wrap: wrap; margin-top: var(--space-3); color: var(--foreground-secondary); font-size: 13px; }
        .meta b { color: var(--accent); }

        /* Toast：使用前景色反色（浅色模式黑底白字 / 暗色模式白底黑字），
           对齐 Next.js / Geist UI 克制用色——蓝仅用于链接，提示态用前景反色 */
        .toast {
            position: fixed; bottom: 32px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            opacity: 0; pointer-events: none;
            padding: 12px 20px; border-radius: var(--radius);
            border: 1px solid var(--gray-200);
            background: var(--foreground); color: var(--background);
            font-size: var(--text-base); font-weight: 500;
            z-index: 1200; max-width: 90%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.04);
            transition: transform .25s, opacity .25s;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
        /* 成功 / 信息态：前景反色（与主按钮一致），不出现蓝 */
        .toast.success, .toast.info { background: var(--foreground); color: var(--background); }
        /* 错误态：保留 --danger 红色作为唯一语义色 */
        .toast.error { background: var(--danger); color: #fff; border-color: var(--danger); }

        /* 右上角主题切换按钮（固定右上角） */
        .theme-toggle {
            position: fixed;
            top: 16px;
            right: max(var(--space-4, 16px), calc((100% - var(--mt-shell)) / 2));
            z-index: 1100;
            width: 40px;
            height: 40px;
            border-radius: var(--radius-full);
            border: 1px solid var(--gray-200);
            background: var(--background);
            color: var(--foreground);
            font-size: 18px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background .2s, border-color .2s, transform .2s;
        }
        .theme-toggle:hover { border-color: var(--gray-300); transform: scale(1.05); }
        .theme-toggle.inline { position: static; width: 36px; height: 36px; }

          }
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

<body>
    <div class="container">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换深色 / 浅色模式" title="切换主题">
            <span class="theme-toggle-icon">🌙</span>
        </button>

        <div class="header">
            <nav class="mt-crumb" aria-label="面包屑导航">
              <a href="../index.html">MiniTools</a>
              <span class="mt-crumb-sep" aria-hidden="true">/</span>
              <span>JSON 格式化</span>
            </nav>
            <h1>JSON 格式化</h1>
            <p>格式化 / 压缩 / 校验 JSON，一键复制或下载</p>
        </div>

        <div class="layout">
            <!-- 左侧：输入 -->
            <div class="card">
                <h2>① 输入 JSON</h2>
                <div class="input-group">
                    <label for="jsonInput">原始 JSON</label>
                    <textarea id="jsonInput" placeholder='在此粘贴 JSON，例如：&#10;{"name":"kingsir","tools":["barcode","html-to-pdf"]}' spellcheck="false"></textarea>
                </div>

                <div class="btn-group">
                    <label class="file-label" for="fileInput">📂 载入 JSON 文件</label>
                    <input type="file" id="fileInput" accept=".json,application/json,text/plain">
                    <button class="btn btn-ghost" onclick="loadSample()">✨ 示例</button>
                    <button class="btn btn-ghost" onclick="clearAll()">🗑️ 清空</button>
                </div>

                <h2 style="margin-top:22px;">② 操作</h2>
                <div class="options">
                    <div class="input-group">
                        <label>缩进</label>
                        <select id="indent">
                            <option value="2" selected>2 个空格</option>
                            <option value="4">4 个空格</option>
                            <option value="tab">Tab</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>排序键</label>
                        <select id="sortKeys">
                            <option value="false" selected>保持原顺序</option>
                            <option value="true">按字母排序</option>
                        </select>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" onclick="formatJSON()">🎨 格式化</button>
                    <button class="btn btn-primary" onclick="minifyJSON()">🗜️ 压缩</button>
                </div>

                <div class="help-text">
                    提示：输入时会自动校验合法性，错误将显示位置与原因。
                </div>
            </div>

            <!-- 右侧：输出 -->
            <div class="card">
                <h2>③ 输出</h2>
                <div id="statusBar" class="status-bar status-idle">
                    <span class="status-dot"></span>
                    <span id="statusText">等待输入…</span>
                </div>

                <div class="input-group">
                    <label for="jsonOutput">结果</label>
                    <textarea id="jsonOutput" readonly placeholder="格式化后的 JSON 将显示在这里"></textarea>
                </div>

                <div class="meta">
                    <span>大小：<b id="metaSize">0 B</b></span>
                    <span>行数：<b id="metaLines">0</b></span>
                </div>

                <div class="btn-group" style="margin-top:14px;">
                    <button class="btn btn-ghost" onclick="copyOutput()">📋 复制</button>
                    <button class="btn btn-primary" onclick="downloadOutput()">📥 下载 .json</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const SAMPLE = {
            name: "MiniTools",
            author: "kingsir",
            version: "0.1",
            tools: [
                { id: "barcode", title: "批量条码生成器", enabled: true },
                { id: "html-to-pdf", title: "HTML 转 PDF", enabled: true },
                { id: "json-formatter", title: "JSON 格式化", enabled: true }
            ],
            config: { theme: "auto", offline: false },
            note: "支持格式化、压缩、校验、复制与下载"
        };

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            setTimeout(() => { toast.className = 'toast'; }, 3200);
        }

        function setStatus(state, text) {
            const bar = document.getElementById('statusBar');
            bar.className = 'status-bar status-' + state;
            document.getElementById('statusText').textContent = text;
        }

        function updateMeta(text) {
            const bytes = new Blob([text]).size;
            let size = bytes + ' B';
            if (bytes >= 1024 * 1024) size = (bytes / 1024 / 1024).toFixed(2) + ' MB';
            else if (bytes >= 1024) size = (bytes / 1024).toFixed(2) + ' KB';
            document.getElementById('metaSize').textContent = size;
            document.getElementById('metaLines').textContent = text ? text.split('\n').length : 0;
        }

        function getIndent() {
            const v = document.getElementById('indent').value;
            if (v === 'tab') return '\t';
            return parseInt(v, 10) || 2;
        }

        function sortedReplacer() {
            if (document.getElementById('sortKeys').value !== 'true') return null;
            return function (key, value) {
                if (value && typeof value === 'object' && !Array.isArray(value)) {
                    return Object.keys(value).sort().reduce((acc, k) => { acc[k] = value[k]; return acc; }, {});
                }
                return value;
            };
        }

        // 解析错误位置（基于 message 中的 position 信息）
        function describeError(err, raw) {
            let msg = err.message || String(err);
            const posMatch = msg.match(/position\s+(\d+)/i) || msg.match(/at position (\d+)/i);
            if (posMatch) {
                const pos = parseInt(posMatch[1], 10);
                const before = raw.slice(0, pos);
                const line = before.split('\n').length;
                const col = pos - before.lastIndexOf('\n');
                return `第 ${line} 行第 ${col} 列附近：${msg}`;
            }
            return msg;
        }

        function validate(raw) {
            if (!raw.trim()) {
                setStatus('idle', '等待输入…');
                return null;
            }
            try {
                const obj = JSON.parse(raw);
                setStatus('valid', '✓ JSON 合法');
                return obj;
            } catch (err) {
                setStatus('invalid', '✗ ' + describeError(err, raw));
                return null;
            }
        }

        function formatJSON() {
            const raw = document.getElementById('jsonInput').value;
            if (!raw.trim()) { showToast('请先输入 JSON', 'error'); return; }
            try {
                const obj = JSON.parse(raw);
                const out = JSON.stringify(obj, sortedReplacer(), getIndent());
                document.getElementById('jsonOutput').value = out;
                setStatus('valid', '✓ 已格式化');
                updateMeta(out);
                showToast('格式化完成', 'success');
            } catch (err) {
                setStatus('invalid', '✗ ' + describeError(err, raw));
                showToast('JSON 不合法，无法格式化', 'error');
            }
        }

        function minifyJSON() {
            const raw = document.getElementById('jsonInput').value;
            if (!raw.trim()) { showToast('请先输入 JSON', 'error'); return; }
            try {
                const obj = JSON.parse(raw);
                const out = JSON.stringify(obj);
                document.getElementById('jsonOutput').value = out;
                setStatus('valid', '✓ 已压缩');
                updateMeta(out);
                showToast('压缩完成', 'success');
            } catch (err) {
                setStatus('invalid', '✗ ' + describeError(err, raw));
                showToast('JSON 不合法，无法压缩', 'error');
            }
        }

        function copyOutput() {
            const out = document.getElementById('jsonOutput').value;
            if (!out) { showToast('没有可复制的内容', 'error'); return; }
            navigator.clipboard.writeText(out).then(
                () => showToast('已复制到剪贴板', 'success'),
                () => showToast('复制失败，请手动选择', 'error')
            );
        }

        function downloadOutput() {
            const out = document.getElementById('jsonOutput').value;
            if (!out) { showToast('没有可导出的内容', 'error'); return; }
            const blob = new Blob([out], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'formatted.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast('已下载 formatted.json', 'success');
        }

        function loadSample() {
            const sample = JSON.stringify(SAMPLE);
            // 故意压成一行以体现“原始”状态
            document.getElementById('jsonInput').value = sample;
            validate(sample);
            updateMeta('');
            showToast('已载入示例', 'info');
        }

        function clearAll() {
            document.getElementById('jsonInput').value = '';
            document.getElementById('jsonOutput').value = '';
            setStatus('idle', '等待输入…');
            updateMeta('');
        }

        // 文件载入
        document.getElementById('fileInput').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById('jsonInput').value = ev.target.result;
                const obj = validate(ev.target.result);
                if (obj) updateMeta('');
                showToast('已载入：' + file.name, 'success');
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        // 输入时自动校验（防抖）
        let timer = null;
        document.getElementById('jsonInput').addEventListener('input', function () {
            clearTimeout(timer);
            timer = setTimeout(() => validate(this.value), 400);
        });
    </script>

    <script>
      (function () {
        var btn = document.getElementById('themeToggle');
        if (!btn) return;
        function syncIcon() {
          var isDark = document.documentElement.classList.contains('dark');
          btn.querySelector('.theme-toggle-icon').textContent = isDark ? '☀️' : '🌙';
          btn.title = isDark ? '切换到浅色' : '切换到深色';
        }
        function applyTheme(t) {
          if (t === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
          try { localStorage.setItem('theme', t); } catch (e) {}
          syncIcon();
          if (typeof window.__onThemeChange === 'function') window.__onThemeChange(t);
        }
        btn.addEventListener('click', function () {
          applyTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
        });
        syncIcon();
      })();
    </script>

  <script>
    /* ========== 中英切换 ==========
       机制：页面里保留中文原文，MAP 是「中文 → 英文」的对照表。
       切换时遍历文本节点与 placeholder / title / aria-label 做替换，
       首次替换前把原文存到节点上，切回中文时还原（不会翻译两次）。
       JS 动态插入的提示、选项、Toast 由 MutationObserver 补翻。
    */
    (function () {
      var KEY = 'lang';
      var REPO = 'https://github.com/isnotry/MiniTools';
      var MAP = {
        "面包屑导航": "Breadcrumb",
        "JSON 格式化 · 校验 / 压缩 / 排序 | MiniTools": "JSON Formatter · Validate / Minify / Sort | MiniTools",
        "在线格式化、压缩、校验与排序 JSON，缩进可选 2 / 4 空格或 Tab，语法错误直接定位到行与列，支持一键复制与下载，全部在浏览器本地处理不上传。": "Format, minify, validate and sort JSON online. Choose 2 or 4 spaces or tabs for indentation; syntax errors are reported with line and column. Copy or download in one click — all in your browser.",
        "在 GitHub 上给项目加星": "Star this project on GitHub",
        "JSON 格式化": "JSON Formatter",
        "格式化 / 压缩 / 校验 JSON，一键复制或下载": "Format, minify and validate JSON — copy or download in one click",
        "切换深色 / 浅色模式": "Toggle dark / light mode",
        "切换主题": "Switch theme",
        "切换到浅色": "Switch to light",
        "切换到深色": "Switch to dark",
        "① 输入 JSON": "① Input JSON",
        "原始 JSON": "Original JSON",
        "📂 载入 JSON 文件": "📂 Load JSON file",
        "✨ 示例": "✨ Sample",
        "🗑️ 清空": "🗑️ Clear",
        "② 操作": "② Actions",
        "缩进": "Indent",
        "2 个空格": "2 spaces",
        "4 个空格": "4 spaces",
        "排序键": "Sort keys",
        "保持原顺序": "Keep original order",
        "按字母排序": "Sort alphabetically",
        "🎨 格式化": "🎨 Format",
        "🗜️ 压缩": "🗜️ Minify",
        "提示：输入时会自动校验合法性，错误将显示位置与原因。": "Tip: JSON is validated as you type — the status bar shows where it breaks and why.",
        "③ 输出": "③ Output",
        "等待输入…": "Waiting for input…",
        "结果": "Result",
        "格式化后的 JSON 将显示在这里": "Formatted JSON shows up here",
        "大小：": "Size: ",
        "行数：": "Lines: ",
        "📋 复制": "📋 Copy",
        "📥 下载 .json": "📥 Download .json",
        "✓ JSON 合法": "✓ Valid JSON",
        "✓ 已格式化": "✓ Formatted",
        "格式化完成": "Formatted",
        "JSON 不合法，无法格式化": "Invalid JSON — cannot format",
        "✓ 已压缩": "✓ Minified",
        "压缩完成": "Minified",
        "JSON 不合法，无法压缩": "Invalid JSON — cannot minify",
        "请先输入 JSON": "Please enter some JSON first",
        "没有可复制的内容": "Nothing to copy",
        "已复制到剪贴板": "Copied to clipboard",
        "复制失败，请手动选择": "Copy failed — please copy manually",
        "没有可导出的内容": "Nothing to download",
        "已下载 formatted.json": "Downloaded formatted.json",
        "已载入示例": "Sample loaded"
      };
      var PAIRS = [
        ["在此粘贴 JSON，例如：", "Paste your JSON here, e.g."],
        [" 行第 ", ", column "],
        ["第 ", "Line "],
        [" 列附近：", ": "],
        ["已载入：", "Loaded: "]
      ];

      var CJK = /[\u4e00-\u9fff\uff00-\uffef]/;
      var busy = false;
      var mo = null;
      var MO_OPT = { childList: true, subtree: true, characterData: true };
      function pause(fn) {
        if (busy) return;
        busy = true;
        try {
          if (mo) mo.disconnect();
          fn();
        } finally {
          if (mo) { try { mo.observe(document.body, MO_OPT); } catch (e) {} }
          busy = false;
        }
      }

      function detect() {
        try {
          var v = localStorage.getItem(KEY);
          if (v === 'zh' || v === 'en') return v;
        } catch (e) {}
        return (navigator.language || '').toLowerCase().indexOf('en') === 0 ? 'en' : 'zh';
      }
      var lang = detect();

      function tr(s) {
        s = String(s);
        var t = s.trim();
        if (MAP[t] != null) return s.replace(t, MAP[t]);
        var out = s;
        for (var i = 0; i < PAIRS.length; i++) {
          if (out.indexOf(PAIRS[i][0]) >= 0) out = out.split(PAIRS[i][0]).join(PAIRS[i][1]);
        }
        return out;
      }

      function applyText(node) {
        if (!node || node.nodeType !== 3) return;
        var v = node.nodeValue;
        if (!v) return;
        if (node.__mt_orig == null) {
          if (!CJK.test(v)) return;
          node.__mt_orig = v;
        }
        var nv = lang === 'en' ? tr(node.__mt_orig) : node.__mt_orig;
        if (nv !== v) node.nodeValue = nv;
      }

      function applyAttrs(el) {
        if (!el || el.nodeType !== 1) return;
        ['placeholder', 'title', 'aria-label'].forEach(function (a) {
          if (!el.hasAttribute(a)) return;
          var v = el.getAttribute(a);
          if (!v) return;
          var k = '__mt_' + a;
          if (el[k] == null) {
            if (!CJK.test(v)) return;
            el[k] = v;
          }
          var nv = lang === 'en' ? tr(el[k]) : el[k];
          if (nv !== v) el.setAttribute(a, nv);
        });
      }

      function walk(root) {
        var tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
        var list = [], n;
        while ((n = tw.nextNode())) list.push(n);
        list.forEach(applyText);
        var els = [];
        if (root.nodeType === 1) {
          els.push(root);
          els = els.concat(Array.prototype.slice.call(root.querySelectorAll('*')));
        }
        els.forEach(applyAttrs);
      }

      function refresh() {
        pause(function () { walk(document.body); });
      }

      window.mtT = function (s) { return lang === 'en' ? tr(s) : s; };

      if (window.MutationObserver) {
        mo = new MutationObserver(function (muts) {
          pause(function () {
            muts.forEach(function (m) {
              if (m.type === 'childList') {
                for (var i = 0; i < m.addedNodes.length; i++) {
                  var a = m.addedNodes[i];
                  if (a.nodeType === 3) applyText(a);
                  else if (a.nodeType === 1) walk(a);
                }
              } else if (m.type === 'characterData') applyText(m.target);
            });
          });
        });
        mo.observe(document.body, MO_OPT);
      }

      function mountStyle() {
        if (document.getElementById('mt-lang-style')) return;
        var st = document.createElement('style');
        st.id = 'mt-lang-style';
st.textContent =
          '.mt-actions{position:fixed;top:16px;right:max(var(--space-4, 16px), calc((100% - var(--mt-shell, 1400px)) / 2 + var(--space-4, 16px)));z-index:1100;display:flex;align-items:center;gap:8px;}' +
          '.mt-actions.inline{position:static;margin-left:auto;}' +
          '.mt-actions>.theme-toggle{position:static;top:auto;right:auto;left:auto;bottom:auto;margin:0;flex:none;}' +
          '.mt-star{height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--gray-200,#eaeaea);background:var(--background,#fff);color:var(--foreground,#171717);font-family:inherit;text-decoration:none;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .2s,border-color .2s,transform .2s;}' +
          '.mt-star:hover{border-color:var(--gray-300,#d4d4d4);transform:scale(1.05);color:var(--foreground,#171717);}' +
          '.mt-star svg{width:15px;height:15px;fill:currentColor;display:block;}' +
          '.mt-lang{height:40px;min-width:46px;padding:0 12px;border-radius:999px;border:1px solid var(--gray-200,#eaeaea);background:var(--background,#fff);color:var(--foreground,#171717);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,transform .2s;}' +
          '.mt-lang:hover{border-color:var(--gray-300,#d4d4d4);transform:scale(1.05);}' +
          '.mt-actions.inline .mt-star,.mt-actions.inline .mt-lang{height:36px;}' +
          '@media (max-width: 640px){.mt-star span{display:none;}.mt-star{padding:0 10px;}}' +
          '@media (hover: none){.mt-star:hover,.mt-lang:hover{transform:none;}}';
                document.head.appendChild(st);
      }

      function syncDoc() {
        document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
        var b = document.getElementById('langToggle');
        if (b) {
          b.textContent = lang === 'en' ? '中' : 'EN';
          var t = lang === 'en' ? 'Switch to Chinese' : 'Switch to English';
          b.setAttribute('title', t);
          b.setAttribute('aria-label', t);
        }
        if (document.__mt_title == null) document.__mt_title = document.title;
        document.title = lang === 'en' ? tr(document.__mt_title) : document.__mt_title;
        var md = document.querySelector('meta[name="description"]');
        if (md) {
          if (md.__mt_orig == null) md.__mt_orig = md.getAttribute('content');
          md.setAttribute('content', lang === 'en' ? tr(md.__mt_orig) : md.__mt_orig);
        }
      }

      function mount() {
        mountStyle();
        var tt = document.getElementById('themeToggle');
        if (!tt || document.getElementById('langToggle')) return;
        var inline = window.getComputedStyle(tt).position !== 'fixed';
        var box = document.createElement('div');
        box.className = 'mt-actions' + (inline ? ' inline' : '');
        tt.parentNode.insertBefore(box, tt);
        box.appendChild(tt);

        var star = document.createElement('a');
        star.className = 'mt-star';
        star.id = 'starLink';
        star.href = REPO;
        star.target = '_blank';
        star.rel = 'noopener noreferrer';
        star.setAttribute('title', '在 GitHub 上给项目加星');
        star.setAttribute('aria-label', '在 GitHub 上给项目加星');
        star.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg><span>Star</span>';
        box.insertBefore(star, tt);

        var btn = document.createElement('button');
        btn.className = 'mt-lang';
        btn.id = 'langToggle';
        btn.type = 'button';
        btn.addEventListener('click', function () {
          lang = lang === 'en' ? 'zh' : 'en';
          try { localStorage.setItem(KEY, lang); } catch (e) {}
          refresh();
          syncDoc();
        });
        box.insertBefore(btn, tt);
      }

      mount();
      refresh();
      syncDoc();
      window.addEventListener('load', function () { refresh(); syncDoc(); });
    })();
  </script>
