<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
    <title>JSON 格式化工具</title>
    <style>
        :root {
            --background: #ffffff;
            --background-subtle: #fafafa;
            --background-muted: #f5f5f5;
            --foreground: #171717;
            --foreground-secondary: #666666;
            --foreground-tertiary: #999999;
            --gray-200: #eaeaea;
            --gray-300: #d4d4d4;
            --gray-700: #333333;
            --accent: #0070f3;
            --accent-hover: #0061d5;
            --accent-subtle: #f0f7ff;
            --danger: #d00;
            --danger-subtle: #ffe0e0;
            --font-sans: "Geist", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            --font-mono: "Geist Mono", "Monaco", "Menlo", "Ubuntu Mono", "Consolas", monospace;
            --text-xs: 12px; --text-sm: 13px; --text-base: 14px;
            --text-md: 16px; --text-lg: 20px; --text-xl: 28px;
            --radius: 8px;
            --radius-sm: 6px;
            --radius-pill: 128px;
            --button-primary-hover: #383838;
            --button-secondary-hover: #f2f2f2;
            --space-2: 8px;
            --space-3: 16px;
            --space-4: 24px;
            --space-5: 32px;
        }

        /* 暗色模式 token：由 <html class="dark"> 驱动，JS 根据系统偏好或手动切换设置 */
        :root.dark {
            --background: #0a0a0a;
            --background-subtle: #111111;
            --background-muted: #1a1a1a;
            --foreground: #ededed;
            --foreground-secondary: #a0a0a0;
            --foreground-tertiary: #666666;
            --gray-200: #333333;
            --gray-300: #444444;
            --gray-700: #cccccc;
            --accent: #0070f3;
            --accent-hover: #3291ff;
            --accent-subtle: #0a2540;
            --danger: #ff6b6b;
            --danger-subtle: #3a1d1d;
            --button-primary-hover: #ccc;
            --button-secondary-hover: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            color: var(--foreground);
            background: var(--background-subtle);
            min-height: 100vh;
            padding: var(--space-4);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        .header { text-align: center; color: var(--foreground); margin-bottom: var(--space-5); }
        .header h1 { font-size: var(--text-xl); font-weight: 700; letter-spacing: -0.02em; margin-bottom: var(--space-2); }
        .header p { opacity: 1; color: var(--foreground-secondary); font-size: var(--text-base); }

        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-4);
            align-items: start;
        }
        @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

        .card {
            background: var(--background);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            padding: var(--space-4);
        }
        .card h2 { color: var(--foreground); margin-bottom: var(--space-3); font-size: var(--text-md); font-weight: 600; letter-spacing: -0.01em; }

        .input-group { margin-bottom: var(--space-3); }
        .input-group label {
            display: block; color: var(--foreground-secondary); margin-bottom: var(--space-2); font-weight: 500; font-size: 14px;
        }

        textarea {
            width: 100%;
            min-height: 360px;
            padding: 12px 14px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 14px;
            font-family: var(--font-mono);
            line-height: 1.5;
            resize: vertical;
            color: var(--foreground);
            background: var(--background);
            transition: border-color .2s, box-shadow .2s;
            tab-size: 2;
        }
        textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-subtle); }
        textarea::placeholder { color: var(--foreground-tertiary); }
        textarea[readonly] { background: var(--background-muted); color: var(--gray-700); }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-3);
            margin: var(--space-3) 0;
        }

        select, input[type="number"], input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 14px;
            font-family: var(--font-sans);
            color: var(--foreground);
            background: var(--background);
            transition: border-color .2s, box-shadow .2s;
        }
        select:focus, input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-subtle); }

        .btn-group { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-2); }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: 48px;
            padding: 0 20px;
            font-size: 16px;
            font-weight: 500;
            line-height: 1;
            border-radius: var(--radius-pill);
            border: 1px solid transparent;
            cursor: pointer;
            transition: background .2s, border-color .2s, color .2s;
        }
        .btn-primary { background: var(--foreground); color: var(--background); }
        .btn-primary:hover { background: var(--button-primary-hover); }
        .btn-secondary { background: var(--background); color: var(--foreground); border-color: var(--gray-200); }
        .btn-secondary:hover { background: var(--button-secondary-hover); }
        .btn-ghost { background: var(--background); color: var(--foreground-secondary); border-color: var(--gray-200); }
        .btn-ghost:hover { background: var(--button-secondary-hover); }

        .file-label {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 10px 18px; border: 1px dashed var(--gray-300); border-radius: var(--radius);
            color: var(--foreground-secondary); font-weight: 600; font-size: 14px; cursor: pointer; transition: background .2s;
        }
        .file-label:hover { background: var(--background-subtle); }
        input[type="file"] { display: none; }

        .help-text { font-size: 13px; color: var(--foreground-tertiary); margin-top: 6px; line-height: 1.5; }

        .status-bar {
            display: flex; align-items: center; gap: 10px;
            padding: 12px var(--space-3); border-radius: var(--radius); margin-bottom: var(--space-3);
            font-size: 14px; font-weight: 500;
        }
        .status-valid { background: var(--accent-subtle); color: var(--accent); border: 1px solid var(--accent); }
        .status-invalid { background: var(--danger-subtle); color: var(--danger); border: 1px solid var(--danger); }
        .status-idle { background: var(--background-subtle); color: var(--foreground-tertiary); border: 1px solid var(--gray-200); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .status-valid .status-dot { background: var(--accent); }
        .status-invalid .status-dot { background: var(--danger); }
        .status-idle .status-dot { background: var(--gray-700); }

        .meta { display: flex; gap: 18px; flex-wrap: wrap; margin-top: var(--space-3); color: var(--foreground-secondary); font-size: 13px; }
        .meta b { color: var(--accent); }

        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #333; color: white; padding: 14px 28px; border-radius: var(--radius);
            font-weight: 500; z-index: 1000; opacity: 0; transition: all 0.3s; max-width: 90%;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { background: var(--accent); color: #fff; }
        .toast.error { background: var(--danger); color: #fff; }
        .toast.info { background: var(--accent); color: #fff; }

        /* 右上角主题切换按钮（固定右上角） */
        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1100;
            width: 40px;
            height: 40px;
            border-radius: var(--radius-full);
            border: 1px solid var(--gray-200);
            background: var(--background);
            color: var(--foreground);
            font-size: 18px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background .2s, border-color .2s, transform .2s;
        }
        .theme-toggle:hover { border-color: var(--gray-300); transform: scale(1.05); }
        .theme-toggle.inline { position: static; width: 36px; height: 36px; }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
</head>
<body>
    <div class="container">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换深色 / 浅色模式" title="切换主题">
            <span class="theme-toggle-icon">🌙</span>
        </button>

        <div class="header">
            <h1>🔧 JSON 格式化工具</h1>
            <p>格式化 / 压缩 / 校验 JSON，一键复制或下载</p>
        </div>

        <div class="layout">
            <!-- 左侧：输入 -->
            <div class="card">
                <h2>① 输入 JSON</h2>
                <div class="input-group">
                    <label for="jsonInput">原始 JSON</label>
                    <textarea id="jsonInput" placeholder='在此粘贴 JSON，例如：&#10;{"name":"kingsir","tools":["barcode","html-to-pdf"]}' spellcheck="false"></textarea>
                </div>

                <div class="btn-group">
                    <label class="file-label" for="fileInput">📂 载入 JSON 文件</label>
                    <input type="file" id="fileInput" accept=".json,application/json,text/plain">
                    <button class="btn btn-ghost" onclick="loadSample()">✨ 示例</button>
                    <button class="btn btn-ghost" onclick="clearAll()">🗑️ 清空</button>
                </div>

                <h2 style="margin-top:22px;">② 操作</h2>
                <div class="options">
                    <div class="input-group">
                        <label>缩进</label>
                        <select id="indent">
                            <option value="2" selected>2 个空格</option>
                            <option value="4">4 个空格</option>
                            <option value="tab">Tab</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>排序键</label>
                        <select id="sortKeys">
                            <option value="false" selected>保持原顺序</option>
                            <option value="true">按字母排序</option>
                        </select>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" onclick="formatJSON()">🎨 格式化</button>
                    <button class="btn btn-primary" onclick="minifyJSON()">🗜️ 压缩</button>
                </div>

                <div class="help-text">
                    提示：输入时会自动校验合法性，错误将显示位置与原因。
                </div>
            </div>

            <!-- 右侧：输出 -->
            <div class="card">
                <h2>③ 输出</h2>
                <div id="statusBar" class="status-bar status-idle">
                    <span class="status-dot"></span>
                    <span id="statusText">等待输入…</span>
                </div>

                <div class="input-group">
                    <label for="jsonOutput">结果</label>
                    <textarea id="jsonOutput" readonly placeholder="格式化后的 JSON 将显示在这里"></textarea>
                </div>

                <div class="meta">
                    <span>大小：<b id="metaSize">0 B</b></span>
                    <span>行数：<b id="metaLines">0</b></span>
                </div>

                <div class="btn-group" style="margin-top:14px;">
                    <button class="btn btn-ghost" onclick="copyOutput()">📋 复制</button>
                    <button class="btn btn-primary" onclick="downloadOutput()">📥 下载 .json</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const SAMPLE = {
            name: "MiniTools",
            author: "kingsir",
            version: "0.1",
            tools: [
                { id: "barcode", title: "批量条码生成器", enabled: true },
                { id: "html-to-pdf", title: "HTML 转 PDF", enabled: true },
                { id: "json-formatter", title: "JSON 格式化", enabled: true }
            ],
            config: { theme: "auto", offline: false },
            note: "支持格式化、压缩、校验、复制与下载"
        };

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            setTimeout(() => { toast.className = 'toast'; }, 3200);
        }

        function setStatus(state, text) {
            const bar = document.getElementById('statusBar');
            bar.className = 'status-bar status-' + state;
            document.getElementById('statusText').textContent = text;
        }

        function updateMeta(text) {
            const bytes = new Blob([text]).size;
            let size = bytes + ' B';
            if (bytes >= 1024 * 1024) size = (bytes / 1024 / 1024).toFixed(2) + ' MB';
            else if (bytes >= 1024) size = (bytes / 1024).toFixed(2) + ' KB';
            document.getElementById('metaSize').textContent = size;
            document.getElementById('metaLines').textContent = text ? text.split('\n').length : 0;
        }

        function getIndent() {
            const v = document.getElementById('indent').value;
            if (v === 'tab') return '\t';
            return parseInt(v, 10) || 2;
        }

        function sortedReplacer() {
            if (document.getElementById('sortKeys').value !== 'true') return null;
            return function (key, value) {
                if (value && typeof value === 'object' && !Array.isArray(value)) {
                    return Object.keys(value).sort().reduce((acc, k) => { acc[k] = value[k]; return acc; }, {});
                }
                return value;
            };
        }

        // 解析错误位置（基于 message 中的 position 信息）
        function describeError(err, raw) {
            let msg = err.message || String(err);
            const posMatch = msg.match(/position\s+(\d+)/i) || msg.match(/at position (\d+)/i);
            if (posMatch) {
                const pos = parseInt(posMatch[1], 10);
                const before = raw.slice(0, pos);
                const line = before.split('\n').length;
                const col = pos - before.lastIndexOf('\n');
                return `第 ${line} 行第 ${col} 列附近：${msg}`;
            }
            return msg;
        }

        function validate(raw) {
            if (!raw.trim()) {
                setStatus('idle', '等待输入…');
                return null;
            }
            try {
                const obj = JSON.parse(raw);
                setStatus('valid', '✓ JSON 合法');
                return obj;
            } catch (err) {
                setStatus('invalid', '✗ ' + describeError(err, raw));
                return null;
            }
        }

        function formatJSON() {
            const raw = document.getElementById('jsonInput').value;
            if (!raw.trim()) { showToast('请先输入 JSON', 'error'); return; }
            try {
                const obj = JSON.parse(raw);
                const out = JSON.stringify(obj, sortedReplacer(), getIndent());
                document.getElementById('jsonOutput').value = out;
                setStatus('valid', '✓ 已格式化');
                updateMeta(out);
                showToast('格式化完成', 'success');
            } catch (err) {
                setStatus('invalid', '✗ ' + describeError(err, raw));
                showToast('JSON 不合法，无法格式化', 'error');
            }
        }

        function minifyJSON() {
            const raw = document.getElementById('jsonInput').value;
            if (!raw.trim()) { showToast('请先输入 JSON', 'error'); return; }
            try {
                const obj = JSON.parse(raw);
                const out = JSON.stringify(obj);
                document.getElementById('jsonOutput').value = out;
                setStatus('valid', '✓ 已压缩');
                updateMeta(out);
                showToast('压缩完成', 'success');
            } catch (err) {
                setStatus('invalid', '✗ ' + describeError(err, raw));
                showToast('JSON 不合法，无法压缩', 'error');
            }
        }

        function copyOutput() {
            const out = document.getElementById('jsonOutput').value;
            if (!out) { showToast('没有可复制的内容', 'error'); return; }
            navigator.clipboard.writeText(out).then(
                () => showToast('已复制到剪贴板', 'success'),
                () => showToast('复制失败，请手动选择', 'error')
            );
        }

        function downloadOutput() {
            const out = document.getElementById('jsonOutput').value;
            if (!out) { showToast('没有可导出的内容', 'error'); return; }
            const blob = new Blob([out], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'formatted.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast('已下载 formatted.json', 'success');
        }

        function loadSample() {
            const sample = JSON.stringify(SAMPLE);
            // 故意压成一行以体现“原始”状态
            document.getElementById('jsonInput').value = sample;
            validate(sample);
            updateMeta('');
            showToast('已载入示例', 'info');
        }

        function clearAll() {
            document.getElementById('jsonInput').value = '';
            document.getElementById('jsonOutput').value = '';
            setStatus('idle', '等待输入…');
            updateMeta('');
        }

        // 文件载入
        document.getElementById('fileInput').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById('jsonInput').value = ev.target.result;
                const obj = validate(ev.target.result);
                if (obj) updateMeta('');
                showToast('已载入：' + file.name, 'success');
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        // 输入时自动校验（防抖）
        let timer = null;
        document.getElementById('jsonInput').addEventListener('input', function () {
            clearTimeout(timer);
            timer = setTimeout(() => validate(this.value), 400);
        });
    </script>

    <script>
      (function () {
        var btn = document.getElementById('themeToggle');
        if (!btn) return;
        function syncIcon() {
          var isDark = document.documentElement.classList.contains('dark');
          btn.querySelector('.theme-toggle-icon').textContent = isDark ? '☀️' : '🌙';
          btn.title = isDark ? '切换到浅色' : '切换到深色';
        }
        function applyTheme(t) {
          if (t === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
          try { localStorage.setItem('theme', t); } catch (e) {}
          syncIcon();
          if (typeof window.__onThemeChange === 'function') window.__onThemeChange(t);
        }
        btn.addEventListener('click', function () {
          applyTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
        });
        syncIcon();
      })();
    </script>
</body>
</html>
